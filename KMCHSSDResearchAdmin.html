<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMC-HSSD Research Management System v1.0.0</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--card:#fff;--tx:#1d2a26;--mu:#66736e;--ac:#0f6b57;--ac2:#e8f3ef;--bd:#dcd8cc;--er:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--card:#1d2425;--tx:#e9efec;--mu:#9aa9a3;--ac:#4cc3a4;--ac2:#1f3a33;--bd:#33403d;--er:#ff8f86}}
:root[data-theme="dark"]{--bg:#14191a;--card:#1d2425;--tx:#e9efec;--mu:#9aa9a3;--ac:#4cc3a4;--ac2:#1f3a33;--bd:#33403d;--er:#ff8f86}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,serif}
h1,h2,h3,nav button,label,th,button,.k{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
header{max-width:980px;margin:auto;padding:16px 16px 6px}header small{color:var(--mu);font:600 11px system-ui;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:20px;margin:2px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:980px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:auto;padding:8px 16px 40px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:17px;margin:12px 0 4px}h3{font-size:14px;margin:0 0 8px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block}
input,select,textarea{width:100%;font:14px system-ui;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
textarea{min-height:60px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ac);padding:5px 9px;font-size:12px;margin:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:5px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
pre{background:var(--ac2);padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap;margin:6px 0}
.msg{padding:10px;border-radius:8px;margin:10px 0;font:14px system-ui;background:var(--ac2)}.msg.e{color:var(--er);border:1px solid var(--er);background:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.k{background:var(--ac2);border-radius:10px;padding:10px}.k b{display:block;font-size:22px;color:var(--ac)}.k span{font-size:12px;color:var(--mu)}
</style></head><body>
<header><small>Kapilvastu Multiple Campus · Dept. of Humanities & Social Sciences</small><h1>KMC-HSSD Research Management System <span style="font:12px system-ui;color:var(--mu)">v1.0.0 · 2026</span></h1></header>
<nav id="nav"></nav>
<main><section id="reg"></section><section id="stu"></section><section id="prog"></section><section id="sup"></section><section id="act"></section><section id="cfg"></section></main>
<script>
const CFG={ORG:"Kapilvastu Multiple Campus (KMC)",DEPT:"Department of Humanities & Social Sciences (KMC-HSSD)",PREFIX:"KMC-HSSD-RES-2026-",ROOT:"KMC-HSSD Research Repository",START:1,
FOLDERS:["01_Profile","02_Topic","03_Proposal","04_Literature","05_Data","06_Progress","07_Final_Report","08_Evaluation"]};
const S={counter:CFG.START-1,students:[],progress:[],log:[],
sups:[{name:"Mr. Bishnu Singh Rayamajhi",email:"bbsrm4591@gmail.com",program:"BA Humanities",max:10,cur:0,status:"Active"},
{name:"Mr. Giriraj Pokhrel",email:"kmckpl@gmail.com",program:"BA Humanities",max:10,cur:0,status:"Active"},
{name:"Mr. Jeevan Marasini",email:"kmlkpl@gmail.com",program:"BA Social Science",max:10,cur:0,status:"Active"}]};
const $=i=>document.getElementById(i);let cur="reg",out="";
const T=[["reg","Register"],["stu","Students"],["prog","Progress"],["sup","Supervisors"],["act","Activity Log"],["cfg","Config"]];
const now=()=>new Date().toLocaleString();
const log=(id,a,u,d)=>S.log.unshift([now(),id,a,u||"SYSTEM",d||""]);
const san=n=>String(n).replace(/[\\\/:*?"<>|#%{}]/g,"-").trim();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const v=i=>$(i).value.trim();
function go(t){cur=t;nav();draw()}
function nav(){$("nav").innerHTML=T.map(t=>`<button class="${t[0]==cur?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");T.forEach(t=>$(t[0]).className=t[0]==cur?"on":"")}
function assign(name,prog){
 if(name)return{name,email:(S.sups.find(s=>s.name==name)||{}).email||""};
 for(const s of S.sups){if((!s.program||s.program.toLowerCase().includes(prog.toLowerCase()))&&s.status.toLowerCase()=="active"&&s.cur<s.max){s.cur++;return{name:s.name,email:s.email}}}
 return{name:"To Be Assigned",email:""}}
function setProg(id,name,stage,status,pct,rem,by,next){
 S.progress.unshift([now(),id,name,stage,status,pct,rem,by,next]);
 const st=S.students.find(x=>x.id==id);if(st){st.pct=pct;st.status=status;st.upd=now()}
 log(id,"Progress updated",by,`${stage} | ${status} | ${pct}%`)}
function register(){
 const d={name:v("n"),email:v("e"),phone:v("p"),prog:v("pr"),sem:v("se"),topic:v("t"),sup:v("su"),area:v("ar"),prob:v("pb"),obj:v("ob")};
 if(!d.name||!d.email){out=`<div class="msg e">${!d.name?"Student Name is missing.":"Student Email is missing."}</div>`;log("SYSTEM","ERROR","SYSTEM",!d.name?"Student Name is missing.":"Student Email is missing.");return draw()}
 if(S.students.some(x=>x.email.toLowerCase()==d.email.toLowerCase()&&x.name==d.name&&x.topic==d.topic)){out=`<div class="msg e">Duplicate submission blocked: this student and topic are already registered.</div>`;return draw()}
 S.counter++;const id=CFG.PREFIX+String(S.counter).padStart(3,"0");
 const sp=assign(d.sup,d.prog);
 const url="https://drive.google.com/drive/folders/"+Math.random().toString(36).slice(2,12);
 S.students.unshift({...d,id,sup:sp.name,supEmail:sp.email,pct:0,status:"Registered",url,reg:now(),upd:now()});
 setProg(id,d.name,"Registration","Completed",5,"Student registered and research repository created.","System","Research topic/proposal preparation");
 log(id,"Student registered","SYSTEM","Research repository created successfully.");
 log(id,"Registration completed","SYSTEM","Student and supervisor notifications sent.");
 const tree=`${CFG.ROOT}/\n└── ${id} - ${san(d.name)}/\n`+CFG.FOLDERS.map((f,i)=>`    ${i<CFG.FOLDERS.length-1?"├":"└"}── ${f}`).join("\n");
 out=`<div class="msg">Registered <b>${id}</b>. Supervisor: ${esc(sp.name)}</div>
 <div class="card"><h3>Drive repository created</h3><pre>${esc(tree)}</pre></div>
 <div class="card"><h3>Email to student</h3><pre>Subject: KMC-HSSD Research Registration - ${id}\n\nDear ${esc(d.name)},\n\nYour research registration at ${CFG.ORG} has been successfully completed.\n\nDepartment: ${CFG.DEPT}\nResearch ID: ${id}\nSupervisor: ${esc(sp.name)}\nSupervisor Email: ${esc(sp.email||"To be assigned")}\n\nResearch Repository:\n${url}\n\nPlease use your Research ID in all research-related submissions and communication.</pre></div>
 ${sp.email?`<div class="card"><h3>Email to supervisor</h3><pre>Subject: New Research Student Assigned - ${id}\n\nDear ${esc(sp.name)},\n\nA new research student has been registered under your supervision.\n\nStudent Name: ${esc(d.name)}\nResearch ID: ${id}\nResearch Topic: ${esc(d.topic||"Not yet submitted")}\n\nResearch Repository:\n${url}</pre></div>`:""}`;
 draw()}
function addSup(){const n=v("sn");if(!n)return;S.sups.push({name:n,email:v("sm"),program:v("sp"),max:Number(v("sx"))||10,cur:0,status:"Active"});log("SYSTEM","Supervisor added","Admin",n);draw()}
function toggleSup(i){const s=S.sups[i];s.status=s.status=="Active"?"Inactive":"Active";draw()}
function upd(){const id=v("pid");const st=S.students.find(x=>x.id==id);if(!st){out2=`Research ID not found: ${id}`;return draw()}
 setProg(id,st.name,v("sg"),v("ss"),Math.max(0,Math.min(100,Number(v("pc"))||0)),v("rm"),v("ub")||"Supervisor",v("na"));out2="";draw()}
function csv(){const h=["Research ID","Student","Email","Program","Supervisor","Status","Progress %","Folder URL"];
 const r=S.students.map(x=>[x.id,x.name,x.email,x.prog,x.sup,x.status,x.pct,x.url].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(","));
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent([h.join(","),...r].join("\n"));a.download="01_Students.csv";a.click()}
let out2="";
const opt=a=>a.map(x=>`<option>${x}</option>`).join("");
function draw(){
 $("reg").innerHTML=`<h2>Student Registration (Form Submit)</h2><div class="card"><div class="f">
 <div><label>Student Name *</label><input id="n"></div><div><label>Email *</label><input id="e" type="email"></div>
 <div><label>Phone</label><input id="p"></div><div><label>Program</label><select id="pr"><option>BA Humanities</option><option>BA Social Science</option><option>Other Programs</option></select></div>
 <div><label>Semester / Year</label><input id="se"></div><div><label>Research Topic</label><input id="t"></div>
 <div><label>Preferred Supervisor (blank = auto-assign)</label><select id="su"><option value="">Auto-assign</option>${opt(S.sups.map(s=>s.name))}</select></div><div><label>Research Area</label><input id="ar"></div></div>
 <label style="margin-top:10px">Problem Statement</label><textarea id="pb"></textarea><label>Objectives</label><textarea id="ob"></textarea>
 <button class="btn" onclick="register()">Submit &amp; Register</button></div>${out}`;
 $("stu").innerHTML=`<h2>01_Students</h2><div class="grid"><div class="k"><b>${S.students.length}</b><span>Registered</span></div><div class="k"><b>${S.students.filter(x=>x.pct>=100).length}</b><span>Completed</span></div><div class="k"><b>${S.students.filter(x=>x.sup=="To Be Assigned").length}</b><span>Unassigned</span></div></div>
 <button class="btn s" style="margin-top:10px" onclick="csv()">Export CSV</button>
 <div class="card tw"><table><tr><th>Research ID</th><th>Student</th><th>Program</th><th>Topic</th><th>Supervisor</th><th>Status</th><th>Progress</th><th>Folder</th></tr>${S.students.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.prog)}</td><td>${esc(x.topic)}</td><td>${esc(x.sup)}</td><td>${esc(x.status)}</td><td><div class="bar"><i style="width:${x.pct}%"></i></div>${x.pct}%</td><td><a href="${x.url}" style="color:var(--ac)" onclick="return false">open</a></td></tr>`).join("")||'<tr><td colspan="8">No students yet. Use Register.</td></tr>'}</table></div>`;
 $("prog").innerHTML=`<h2>Progress Tracking</h2><div class="card"><div class="f">
 <div><label>Research ID</label><select id="pid">${opt(S.students.map(x=>x.id))}</select></div>
 <div><label>Stage</label><select id="sg">${opt(["Proposal","Literature Review","Data Collection","Analysis","Draft Report","Final Submission","Evaluation"])}</select></div>
 <div><label>Status</label><select id="ss">${opt(["Submitted","In Progress","Under Review","Revision Required","Approved","Completed"])}</select></div>
 <div><label>Progress %</label><input id="pc" type="number" min="0" max="100" value="20"></div>
 <div><label>Updated By</label><input id="ub"></div><div><label>Next Action</label><input id="na"></div></div>
 <label style="margin-top:10px">Remarks</label><textarea id="rm"></textarea><button class="btn" onclick="upd()">Update Progress</button>${out2?`<div class="msg e">${esc(out2)}</div>`:""}</div>
 <div class="card tw"><table><tr><th>Time</th><th>ID</th><th>Student</th><th>Stage</th><th>Status</th><th>%</th><th>By</th><th>Next action</th></tr>${S.progress.map(r=>`<tr><td>${r[0]}</td><td>${r[1].slice(-3)}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${r[5]}</td><td>${esc(r[7])}</td><td>${esc(r[8])}</td></tr>`).join("")||'<tr><td colspan="8">No progress records.</td></tr>'}</table></div>`;
 $("sup").innerHTML=`<h2>09_Supervisors</h2><div class="card tw"><table><tr><th>Name</th><th>Email</th><th>Program</th><th>Students</th><th>Status</th><th></th></tr>${S.sups.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.program)}</td><td>${s.cur} / ${s.max}</td><td>${s.status}</td><td><button class="btn s" onclick="toggleSup(${i})">${s.status=="Active"?"Deactivate":"Activate"}</button></td></tr>`).join("")}</table></div>
 <div class="card"><h3>Add supervisor</h3><div class="f"><div><label>Name</label><input id="sn"></div><div><label>Email</label><input id="sm"></div><div><label>Program</label><input id="sp"></div><div><label>Max students</label><input id="sx" type="number" value="10"></div></div><button class="btn" onclick="addSup()">Add</button></div>`;
 $("act").innerHTML=`<h2>13_Activity_Log</h2><div class="card tw"><table><tr><th>Timestamp</th><th>Research ID</th><th>Action</th><th>User</th><th>Details</th></tr>${S.log.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")||'<tr><td colspan="5">No activity yet.</td></tr>'}</table></div>`;
 $("cfg").innerHTML=`<h2>Configuration</h2><div class="card"><pre>ORGANIZATION: ${CFG.ORG}\nDEPARTMENT:   ${CFG.DEPT}\nID_PREFIX:    ${CFG.PREFIX}\nROOT_FOLDER:  ${CFG.ROOT}\nCOUNTER:      ${S.counter}\nNEXT ID:      ${CFG.PREFIX+String(S.counter+1).padStart(3,"0")}\nTIMEZONE:     ${Intl.DateTimeFormat().resolvedOptions().timeZone}</pre>
 <h3>Sheets</h3><pre>01_Students · 02_Research_Topics · 03_Proposals · 04_Literature · 05_Data\n06_Progress_Tracking · 07_Final_Submission · 08_Evaluation · 09_Supervisors\n10_Settings · 13_Activity_Log</pre><h3>Subfolders</h3><pre>${CFG.FOLDERS.join("\n")}</pre></div>`}
nav();draw();
</script></body></html>
