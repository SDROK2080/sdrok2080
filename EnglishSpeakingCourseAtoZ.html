<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Speaking Course: A to Z — SMART App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Bitter:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#14110d;--surface:#1e1a14;--surface2:#2a241a;--text:#f3ead8;--muted:#b5a88f;
  --gold:#e9b44c;--orange:#f08a3c;--ok:#6fcf97;--bad:#ef6f6c;--line:#3a3226;--on-gold:#1a1408;
  --body:"Mukta","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --head:"Bitter","Noto Serif Devanagari",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#fbf6ea;--surface:#fffdf7;--surface2:#f3ead3;--text:#2a2216;--muted:#6b5e45;--gold:#b87a0a;--orange:#c85a12;--ok:#1f8a4c;--bad:#c0392b;--line:#e3d8bf;--on-gold:#fffdf7}
}
:root[data-theme="light"]{--bg:#fbf6ea;--surface:#fffdf7;--surface2:#f3ead3;--text:#2a2216;--muted:#6b5e45;--gold:#b87a0a;--orange:#c85a12;--ok:#1f8a4c;--bad:#c0392b;--line:#e3d8bf;--on-gold:#fffdf7}
:root[data-theme="dark"]{--bg:#14110d;--surface:#1e1a14;--surface2:#2a241a;--text:#f3ead8;--muted:#b5a88f;--gold:#e9b44c;--orange:#f08a3c;--ok:#6fcf97;--bad:#ef6f6c;--line:#3a3226;--on-gold:#1a1408}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);line-height:1.25;margin:0 0 .4em}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:.3em 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-family:var(--head);font-weight:800;font-size:1.05rem;color:var(--gold);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;min-height:36px}
.chip[aria-pressed="true"],.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:16px 14px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;border-radius:10px;min-height:52px}
nav.tabs button span.i{font-size:1.25rem;line-height:1.2}
nav.tabs button.on{color:var(--gold);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card.flat{border-radius:6px}
.muted{color:var(--muted)}
.ne{color:var(--muted);font-size:.95em}
.btn{background:var(--gold);color:var(--on-gold);border:0;border-radius:10px;padding:10px 18px;font-weight:700;min-height:44px}
.btn.alt{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.warn{background:var(--orange);color:var(--on-gold)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.hero{padding:6px 2px 14px}
.hero p.lead{font-size:1.05rem;max-width:34em}
/* speaking ladder: the memorable element */
.ladder{display:flex;flex-direction:column;gap:7px;margin:14px 0 4px}
.rung{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.rung .bar{height:34px;border-radius:4px 10px 10px 4px;background:linear-gradient(90deg,var(--orange),var(--gold));display:flex;align-items:center;padding:0 10px;color:var(--on-gold);font-weight:700;font-size:.9rem;white-space:nowrap;min-width:76px;position:relative;overflow:hidden}
.rung .bar i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.28);width:0}
.rung .bar b{position:relative}
.rung .lab{font-size:.88rem;color:var(--muted);flex:1;min-width:0}
.vgrid{display:grid;gap:12px}
.vcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:6px 16px 16px 6px;padding:12px 14px}
.vcard h3{margin-bottom:2px}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:99px}
.lesson-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:56px}
.lesson-item .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.lesson-item.done .ck{background:var(--ok);border-color:var(--ok);color:#06220f}
.phr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.phr:last-child{border-bottom:0}
.say{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:var(--surface2);font-size:1.1rem}
.model{background:var(--surface2);border-left:4px solid var(--orange);border-radius:4px 10px 10px 4px;padding:12px 14px;font-size:1.05rem}
.task{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:46px}
.opt.right{border-color:var(--ok);background:rgba(111,207,151,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(239,111,108,.16)}
.timer{font-family:var(--head);font-size:3.6rem;font-weight:800;text-align:center;color:var(--gold);letter-spacing:.02em;margin:6px 0}
.band{position:relative;height:18px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.band .zone{position:absolute;top:0;bottom:0;background:rgba(111,207,151,.28)}
.band .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0}
.zonetxt{text-align:center;font-weight:700;min-height:1.7em;margin-top:8px}
.live{min-height:3.2em;background:var(--surface2);border-radius:10px;padding:8px 12px;color:var(--muted);font-style:italic;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--head);font-size:1.5rem;color:var(--gold)}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:0 6px 8px 0;font-size:.9rem;background:var(--surface)}
.badge.off{opacity:.45;filter:grayscale(1)}
.crumb{background:none;border:0;color:var(--gold);padding:6px 0;font-weight:700;min-height:40px}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:.85rem;color:var(--muted)}
footer.credit{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.vid{border-left:6px solid var(--orange);border-radius:6px 14px 14px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.vgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">English Speaking A–Z</div>
  <button class="chip" data-act="lang" id="langBtn" aria-label="Switch language">EN | नेपा</button>
  <button class="chip" data-act="theme" id="themeBtn" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>

<script>
"use strict";
/* ================= DATA ================= */
const VOL = [
{ n:1, icon:"🌱", t:"Speaking from Zero", s:"नेपाली सिकारुहरूका लागि बिल्कुलै शून्यबाट सुरु गर्ने तरिका", target:[10,30], lab:"10–30 seconds",
 lessons:[
 { t:["Greetings & Introducing Yourself","अभिवादन र आफ्नो परिचय"], g:["Say hello and introduce yourself in four short sentences.","नमस्ते भन्ने र चार छोटा वाक्यमा आफ्नो परिचय दिने।"],
  p:[["Hello! How are you?","नमस्ते! तपाईंलाई कस्तो छ?"],["I am fine, thank you.","म ठीक छु, धन्यवाद।"],["My name is ___.","मेरो नाम ___ हो।"],["I am from Taulihawa.","म तौलिहवाबाट आएको हुँ।"],["Nice to meet you.","तपाईंलाई भेटेर खुसी लाग्यो।"]],
  m:"Hello! My name is Sita. I am from Kapilvastu, Nepal. I am a student. I study at Kapilvastu Multiple Campus. I like reading and music. Nice to meet you.",
  mn:"नमस्ते! मेरो नाम सीता हो। म कपिलवस्तु, नेपालकी हुँ। म विद्यार्थी हुँ। म कपिलवस्तु बहुमुखी क्याम्पसमा पढ्छु। मलाई पढ्न र सङ्गीत मन पर्छ।",
  k:[["Introduce yourself: name, place, work or study, one hobby.","आफ्नो परिचय दिनुहोस्: नाम, ठाउँ, काम/अध्ययन, एउटा रुचि।"],["Greet a new classmate and ask two questions.","नयाँ सहपाठीलाई अभिवादन गरी दुई प्रश्न सोध्नुहोस्।"]],
  q:{q:"Which sentence is correct?",o:["I am name Ram.","My name is Ram.","I name is Ram."],a:1,n:"नाम भन्दा 'My name is ...' प्रयोग गरिन्छ।"} },
 { t:["Family & Home","परिवार र घर"], g:["Describe your family and your home in simple sentences.","सरल वाक्यमा आफ्नो परिवार र घरको वर्णन गर्ने।"],
  p:[["This is my mother.","यो मेरी आमा हुन्।"],["I have two brothers and one sister.","मेरा दुई भाइ र एक बहिनी छन्।"],["We live in a small house.","हामी सानो घरमा बस्छौँ।"],["My father is a farmer.","मेरो बुबा किसान हुनुहुन्छ।"],["I love my family.","मलाई मेरो परिवार मन पर्छ।"]],
  m:"There are five people in my family. My father is a farmer and my mother is a housewife. I have one brother and one sister. We live in a small house near the market. I love my family very much.",
  mn:"मेरो परिवारमा पाँच जना छन्। बुबा किसान र आमा गृहिणी हुनुहुन्छ। मेरो एक भाइ र एक बहिनी छन्। हामी बजारनजिकै सानो घरमा बस्छौँ।",
  k:[["Describe your family in five sentences.","आफ्नो परिवारबारे पाँच वाक्य भन्नुहोस्।"],["Describe your room in four sentences.","आफ्नो कोठाबारे चार वाक्य भन्नुहोस्।"]],
  q:{q:"She ___ my sister.",o:["is","are","am"],a:0,n:"She / He / It सँग 'is' प्रयोग हुन्छ।"} },
 { t:["Daily Routine","दैनिक दिनचर्या"], g:["Talk about your day in order, using first, then, after that.","पहिले, त्यसपछि जस्ता शब्द प्रयोग गरी दिनचर्या क्रमैसँग भन्ने।"],
  p:[["I wake up at six o'clock.","म छ बजे उठ्छु।"],["I brush my teeth and take a bath.","म दाँत माझ्छु र नुहाउँछु।"],["I go to college by bus.","म बसमा कलेज जान्छु।"],["I have lunch at one.","म एक बजे खाना खान्छु।"],["I go to bed at ten.","म दश बजे सुत्न जान्छु।"]],
  m:"I wake up at six. First, I wash my face and have tea. Then I go to college at nine. I study until three. In the evening, I help my mother and read a book. I go to bed at ten.",
  mn:"म छ बजे उठ्छु। पहिले मुख धोएर चिया खान्छु। त्यसपछि नौ बजे कलेज जान्छु। साँझ आमालाई सघाउँछु र किताब पढ्छु। दश बजे सुत्छु।",
  k:[["Tell your morning routine with first, then, after that.","पहिले, त्यसपछि प्रयोग गरी बिहानको दिनचर्या भन्नुहोस्।"],["Tell what you do on Sunday.","आइतबार के गर्नुहुन्छ भन्नुहोस्।"]],
  q:{q:"He ___ to college every day.",o:["go","goes","going"],a:1,n:"He / She सँग simple present मा verb मा -s/-es लाग्छ।"} },
 { t:["Likes & Dislikes","मनपर्ने र नपर्ने कुरा"], g:["Say what you like and dislike, and give one small reason.","के मन पर्छ र पर्दैन, एउटा सानो कारणसहित भन्ने।"],
  p:[["I like cricket.","मलाई क्रिकेट मन पर्छ।"],["I don't like spicy food.","मलाई पिरो खाना मन पर्दैन।"],["My favourite colour is blue.","मेरो मनपर्ने रङ निलो हो।"],["I enjoy listening to songs.","मलाई गीत सुन्न रमाइलो लाग्छ।"],["What about you?","तपाईंलाई चाहिँ?"]],
  m:"I like momo and dal bhat. I don't like bitter food. My favourite sport is football. In the evening, I enjoy listening to songs. What about you?",
  mn:"मलाई मोमो र दालभात मन पर्छ। तितो खाना मन पर्दैन। मनपर्ने खेल फुटबल हो। साँझमा गीत सुन्न रमाइलो लाग्छ। तपाईंलाई चाहिँ?",
  k:[["Say three things you like and two you don't.","तीओटा मन पर्ने र दुईओटा नपर्ने कुरा भन्नुहोस्।"],["Describe your favourite food in 20 seconds.","आफ्नो मनपर्ने खाना २० सेकेन्डमा वर्णन गर्नुहोस्।"]],
  q:{q:"I ___ like coffee.",o:["don't","doesn't","not"],a:0,n:"I सँग negative बनाउन 'don't' प्रयोग हुन्छ।"} },
 { t:["Numbers, Time & Days","सङ्ख्या, समय र दिन"], g:["Tell the time, the day and a date without hesitation.","समय, वार र मिति बिना हिच्किचाहट भन्ने।"],
  p:[["What time is it?","कति बज्यो?"],["It's half past five.","साढे पाँच बज्यो।"],["Today is Monday.","आज सोमबार हो।"],["My birthday is in May.","मेरो जन्मदिन मे महिनामा पर्छ।"],["The class starts at ten.","कक्षा दश बजे सुरु हुन्छ।"]],
  m:"Today is Monday. My class starts at ten o'clock. It finishes at half past two. My birthday is in May. I was born on the fifth of May.",
  mn:"आज सोमबार हो। मेरो कक्षा दश बजे सुरु भएर साढे दुई बजे सकिन्छ। मेरो जन्मदिन मे महिनामा पर्छ।",
  k:[["Say your weekly class timetable.","साप्ताहिक कक्षा तालिका भन्नुहोस्।"],["Say your birthday and the birthdays of two family members.","आफ्नो र परिवारका दुई जनाको जन्मदिन भन्नुहोस्।"]],
  q:{q:"How do we say 7:30?",o:["Half past seven","Half to seven","Seven past half"],a:0,n:"३० मिनेट बितेको समयलाई 'half past' भनिन्छ।"} },
 { t:["Asking & Answering Simple Questions","सरल प्रश्न सोध्ने र जवाफ दिने"], g:["Ask polite questions and ask people to repeat.","विनम्र प्रश्न सोध्ने र दोहोर्‍याउन अनुरोध गर्ने।"],
  p:[["Where do you live?","तपाईं कहाँ बस्नुहुन्छ?"],["What do you do?","तपाईं के गर्नुहुन्छ?"],["How much is this?","यो कतिमा हो?"],["Can you help me, please?","कृपया मलाई मद्दत गर्न सक्नुहुन्छ?"],["Could you say that again?","कृपया फेरि भन्न सक्नुहुन्छ?"]],
  m:"Excuse me, where do you live? I live in Taulihawa. What do you do? I am a teacher. Could you say that again, please? Sure. I am a teacher. Thank you!",
  mn:"एउटा सानो संवाद: कहाँ बस्नुहुन्छ, के गर्नुहुन्छ भनेर सोध्ने र फेरि भन्न अनुरोध गर्ने।",
  k:[["Ask a friend five questions about daily life.","साथीलाई दैनिक जीवनबारे पाँचओटा प्रश्न सोध्नुहोस्।"],["Ask a stranger for help politely.","अपरिचितसँग विनम्रतापूर्वक मद्दत माग्नुहोस्।"]],
  q:{q:"Which sentence is the most polite?",o:["Give me water.","Could I have some water, please?","Water give me."],a:1,n:"'Could I ... please?' विनम्र अनुरोध हो।"} }
 ]},
{ n:2, icon:"💬", t:"Daily Conversation Mastery", s:"दैनिक कुराकानी र व्यवहारिक बोलचालमा पकड जमाउने अभ्यास", target:[30,60], lab:"30–60 seconds",
 lessons:[
 { t:["Shopping & Bargaining","किनमेल र मोलमोलाइ"], g:["Ask prices, bargain politely and pay.","मूल्य सोध्ने, विनम्र मोलमोलाइ गर्ने र भुक्तानी गर्ने।"],
  p:[["How much does this cost?","यसको मूल्य कति हो?"],["That's too expensive. Can you reduce the price?","यो धेरै महँगो भयो। अलि घटाउन सक्नुहुन्छ?"],["Do you have a smaller size?","तपाईंसँग अलि सानो साइज छ?"],["I'll take two kilos.","म दुई किलो लिन्छु।"],["Can I pay by mobile wallet?","के म मोबाइल वालेटबाट तिर्न सक्छु?"]],
  m:"Customer: How much are these oranges? Shopkeeper: One hundred rupees a kilo. Customer: That's a bit expensive. Can you reduce the price? Shopkeeper: Okay, ninety. Customer: Fine, I'll take two kilos. Can I pay by mobile wallet? Shopkeeper: Yes, of course.",
  mn:"ग्राहकले सुन्तलाको मूल्य सोध्छ, अलि घटाउन भन्छ, दुई किलो किन्छ र मोबाइल वालेटबाट तिर्छ।",
  k:[["Role-play buying a shirt in a shop for 45 seconds.","पसलमा सर्ट किन्ने भूमिका-अभिनय ४५ सेकेन्ड गर्नुहोस्।"],["Describe the last thing you bought and why.","पछिल्लोपटक के किन्नुभयो र किन भन्नुहोस्।"]],
  q:{q:"To ask for a lower price we say:",o:["Can you reduce the price?","Why price is high?","Reduce it now."],a:0,n:"'Can you reduce the price?' विनम्र तरिका हो।"} },
 { t:["Food & Restaurant","खाना र रेस्टुराँ"], g:["Order food, make requests and ask for the bill.","खाना अर्डर गर्ने, अनुरोध गर्ने र बिल माग्ने।"],
  p:[["Could we have the menu, please?","कृपया मेनु दिनुहोस् न।"],["I'd like a plate of veg momo.","मलाई एक प्लेट भेज मोमो चाहियो।"],["Not too spicy, please.","धेरै पिरो नगर्नुहोला।"],["The food was delicious.","खाना साह्रै मिठो थियो।"],["Could I have the bill, please?","बिल दिनुहोस् न।"]],
  m:"Good evening. Could we have the menu, please? I'd like a plate of veg momo and a cup of tea. Not too spicy, please. ... The food was delicious. Could I have the bill, please? Thank you very much.",
  mn:"रेस्टुराँमा मेनु माग्ने, मोमो र चिया अर्डर गर्ने, खाना मिठो भनेर बिल माग्ने।",
  k:[["Order a full meal for two people.","दुई जनाका लागि पूरा खाना अर्डर गर्नुहोस्।"],["Tell about the best meal you ever had.","आफूले खाएको सबैभन्दा मिठो खानाबारे भन्नुहोस्।"]],
  q:{q:"Which is the polite way to order?",o:["I want food.","I'd like a plate of momo, please.","Give momo fast."],a:1,n:"'I'd like ...' विनम्र अर्डर गर्ने तरिका हो।"} },
 { t:["Transport & Directions","यातायात र दिशा"], g:["Ask for directions and give them clearly.","बाटो सोध्ने र स्पष्टसँग बताउने।"],
  p:[["Excuse me, how do I get to the bus park?","माफ गर्नुहोस्, बसपार्क कसरी पुग्ने?"],["Go straight and turn left.","सिधा जानुहोस् र बायाँ मोडिनुहोस्।"],["It's about ten minutes' walk.","यो करिब दश मिनेटको पैदल दूरी हो।"],["Does this bus go to Butwal?","के यो बस बुटवल जान्छ?"],["Please drop me here.","कृपया मलाई यहीँ ओरालिदिनुहोस्।"]],
  m:"Excuse me, how do I get to the bus park? Go straight for two hundred metres, then turn left at the temple. It is about ten minutes on foot. You will see it on your right. Thank you so much!",
  mn:"बसपार्क जाने बाटो सोध्ने र उत्तरमा सिधा गएर मन्दिरमा बायाँ मोडिने निर्देशन।",
  k:[["Explain the way from your home to your college.","घरबाट कलेज पुग्ने बाटो बताउनुहोस्।"],["Tell how you travel to the nearest city.","नजिकको सहर कसरी जानुहुन्छ भन्नुहोस्।"]],
  q:{q:"'Turn left' means:",o:["बायाँ मोडिनुहोस्","दायाँ मोडिनुहोस्","सिधा जानुहोस्"],a:0,n:"Left = बायाँ, right = दायाँ, straight = सिधा।"} },
 { t:["Health & Doctor","स्वास्थ्य र डाक्टर"], g:["Describe symptoms and understand simple advice.","लक्षण वर्णन गर्ने र सरल सल्लाह बुझ्ने।"],
  p:[["I have a headache and a fever.","मलाई टाउको दुखेको र ज्वरो आएको छ।"],["Since when have you felt this way?","कहिलेदेखि यस्तो महसुस भएको?"],["Take this medicine twice a day.","यो औषधि दिनको दुई पटक खानुहोस्।"],["I need to see a doctor.","मैले डाक्टरलाई देखाउनुपर्छ।"],["Get well soon.","चाँडै निको हुनुहोस्।"]],
  m:"Doctor: What is the problem? Patient: I have a headache and a fever since yesterday. Doctor: Take this medicine twice a day and drink plenty of water. Rest for two days. Patient: Thank you, doctor.",
  mn:"बिरामीले हिजोदेखिको टाउको दुखाइ र ज्वरो बताउँछ; डाक्टरले औषधि र आराम सुझाउँछ।",
  k:[["Role-play a visit to a doctor for 40 seconds.","डाक्टरकहाँ जाने भूमिका-अभिनय ४० सेकेन्ड गर्नुहोस्।"],["Give a friend three tips to stay healthy.","स्वस्थ रहन साथीलाई तीनओटा सुझाव दिनुहोस्।"]],
  q:{q:"I ___ a headache.",o:["have","am","do"],a:0,n:"लक्षण भन्दा 'I have a ...' प्रयोग हुन्छ।"} },
 { t:["Phone Calls & Making Plans","फोन कुराकानी र योजना बनाउने"], g:["Make a call, take a message and plan to meet.","फोन गर्ने, सन्देश लिने र भेट्ने योजना बनाउने।"],
  p:[["Hello, may I speak to Mr. Sharma?","हेलो, के शर्मा सरसँग कुरा गर्न सकिन्छ?"],["Can I take a message?","म सन्देश लिन सक्छु?"],["Are you free on Saturday?","शनिबार तपाईं फुर्सदमा हुनुहुन्छ?"],["Let's meet at four.","चार बजे भेटौँ।"],["I'm sorry, I can't make it.","माफ गर्नुहोस्, म आउन सक्दिनँ।"]],
  m:"Hello, may I speak to Mr. Sharma? He is not here right now. Can I take a message? Yes, please tell him Ram called. Are you free on Saturday? Let's meet at four near the campus gate.",
  mn:"फोन गरेर शर्मा सरलाई खोज्ने, सन्देश छाड्ने र शनिबार भेट्ने योजना बनाउने।",
  k:[["Role-play a phone call to a friend to plan a trip.","साथीलाई फोन गरी यात्राको योजना बनाउने अभिनय गर्नुहोस्।"],["Leave a short voice message.","छोटो भ्वाइस सन्देश छाड्नुहोस्।"]],
  q:{q:"Polite way to refuse an invitation:",o:["I won't come.","I'm sorry, I can't make it.","No, I don't want."],a:1,n:"'I'm sorry, I can't make it.' विनम्र इन्कार हो।"} },
 { t:["Weather, Festivals & Culture","मौसम, चाडपर्व र संस्कृति"], g:["Talk about weather and your festivals in one minute.","मौसम र चाडपर्वबारे एक मिनेट बोल्ने।"],
  p:[["It's very hot today.","आज धेरै गर्मी छ।"],["We celebrate Dashain in autumn.","हामी शरद ऋतुमा दशैँ मनाउँछौँ।"],["People receive tika and blessings from elders.","मानिसहरूले ठूलाबडाबाट टीका र आशीर्वाद पाउँछन्।"],["It is my favourite festival.","यो मेरो मनपर्ने चाड हो।"],["Buddha was born in Lumbini.","बुद्धको जन्म लुम्बिनीमा भएको थियो।"]],
  m:"Dashain is the biggest festival in Nepal. We celebrate it in autumn. Families come together and eat special food. Young people receive tika and blessings from elders. It is my favourite festival because everyone is happy.",
  mn:"दशैँ नेपालको ठूलो चाड हो; परिवार जुटेर खाना खान्छन् र ठूलाबडाबाट टीका लगाउँछन्।",
  k:[["Describe your favourite festival for 50 seconds.","मनपर्ने चाडबारे ५० सेकेन्ड बोल्नुहोस्।"],["Describe today's weather and what you will wear.","आजको मौसम र के लगाउनुहुन्छ भन्नुहोस्।"]],
  q:{q:"We ___ Dashain in autumn.",o:["celebrate","celebrates","celebrating"],a:0,n:"We सँग verb को base form: celebrate।"} }
 ]},
{ n:3, icon:"🌊", t:"Natural Spoken English & Fluency", s:"प्राकृतिक रूपमा नअड्किई धाराप्रवाह बोल्ने कला र अभ्यास", target:[60,120], lab:"1–2 minutes",
 lessons:[
 { t:["Fillers & Connectors","जोड्ने शब्द र समय किन्ने वाक्यांश"], g:["Use natural linking words so you never go silent.","मौन नबस्न प्राकृतिक जोड्ने शब्द प्रयोग गर्ने।"],
  p:[["Well, let me think...","हुन त, सोचौँ त..."],["You know, it's like this.","थाहै छ, कुरा यस्तो हो।"],["Actually, I think so.","वास्तवमा, मलाई त्यस्तै लाग्छ।"],["First of all... besides that... in the end...","सबैभन्दा पहिले... त्यसबाहेक... अन्त्यमा..."],["Anyway, let me continue.","जे होस्, म अगाडि बढाउँछु।"]],
  m:"Well, let me think. Actually, my best holiday was in Pokhara. First of all, the lake was so calm. Besides that, the food was great and the people were friendly. You know, I felt completely relaxed. Anyway, in the end, I promised myself to go back next year.",
  mn:"जोड्ने शब्द (well, actually, besides that, anyway) प्रयोग गरी पोखरा यात्राको कुरा।",
  k:[["Talk about your best holiday for 1 minute using at least four connectors.","कम्तीमा चारओटा जोड्ने शब्द प्रयोग गरी मनपर्ने बिदाबारे १ मिनेट बोल्नुहोस्।"],["Describe your village or city for 1 minute.","आफ्नो गाउँ वा सहरबारे १ मिनेट बोल्नुहोस्।"]],
  q:{q:"Which phrase gives you time to think?",o:["Well, let me think...","Stop talking.","I no know."],a:0,n:"'Well, let me think...' ले सोच्ने समय दिन्छ।"} },
 { t:["Telling a Story","कथा सुनाउने"], g:["Tell a past event in order: beginning, problem, ending.","विगतको घटना क्रमैसँग: सुरु, समस्या, अन्त्य भन्ने।"],
  p:[["Last year, I went to Lumbini.","गत वर्ष म लुम्बिनी गएँ।"],["At first, I was nervous.","सुरुमा म नर्भस थिएँ।"],["Suddenly, the bus stopped.","अचानक बस रोकियो।"],["Luckily, a man helped us.","सौभाग्यवश, एक जना मान्छेले हामीलाई सहयोग गर्‍यो।"],["In the end, we reached safely.","अन्त्यमा हामी सुरक्षित पुग्यौँ।"]],
  m:"Last year, I went to Lumbini with my friends. At first, we were very excited. Suddenly, the bus stopped on the road. Everyone was worried. Luckily, a driver stopped and helped us fix it. After two hours, we reached Lumbini. In the end, it became a memory we still laugh about.",
  mn:"लुम्बिनी यात्रामा बस बिग्रिएपछि एक जना चालकले सहयोग गरेको कथा।",
  k:[["Tell a funny or scary memory for 90 seconds.","रमाइलो वा डरलाग्दो सम्झना ९० सेकेन्ड सुनाउनुहोस्।"],["Tell the story of your first day at college.","कलेजको पहिलो दिनको कथा सुनाउनुहोस्।"]],
  q:{q:"Which word shows an unexpected event?",o:["Suddenly","Usually","Always"],a:0,n:"'Suddenly' = अचानक, अप्रत्याशित घटनामा प्रयोग हुन्छ।"} },
 { t:["Expressing Opinions","विचार व्यक्त गर्ने"], g:["Give an opinion with a reason and an example.","विचार, कारण र उदाहरणसहित बोल्ने।"],
  p:[["In my opinion, ...","मेरो विचारमा..."],["I strongly believe that...","मलाई दृढ विश्वास छ कि..."],["On the one hand... on the other hand...","एकातिर... अर्कातिर..."],["The main reason is...","मुख्य कारण..."],["That's why I think...","त्यसैले मलाई लाग्छ..."]],
  m:"In my opinion, students should learn English speaking from the first year. The main reason is that confidence takes time. For example, my friend started early and now he can speak in public easily. That's why I think speaking practice should be daily.",
  mn:"विद्यार्थीले पहिलो वर्षदेखि नै अंग्रेजी बोल्ने अभ्यास गर्नुपर्छ भन्ने विचार र कारण।",
  k:[["Give your opinion on mobile phones in class (90 sec).","कक्षामा मोबाइलबारे आफ्नो विचार ९० सेकेन्ड भन्नुहोस्।"],["Village life or city life: choose one and explain.","गाउँ वा सहर: एउटा छानेर कारण बताउनुहोस्।"]],
  q:{q:"Best way to start an opinion:",o:["In my opinion, ...","Because yes.","I don't know why."],a:0,n:"'In my opinion' ले विचार स्पष्ट सुरु गर्छ।"} },
 { t:["Agreeing, Disagreeing & Interrupting","सहमति, असहमति र बीचमा बोल्ने"], g:["Disagree and interrupt politely in a conversation.","कुराकानीमा विनम्रतापूर्वक असहमत हुने र बीचमा बोल्ने।"],
  p:[["I totally agree with you.","म तपाईंसँग पूर्ण रूपमा सहमत छु।"],["I see your point, but...","तपाईंको कुरा बुझेँ, तर..."],["I'm afraid I disagree.","माफ गर्नुहोस्, म सहमत छैन।"],["Sorry to interrupt, but...","बीचमा बोलेकोमा माफ गर्नुहोस्, तर..."],["Could I add something?","मैले केही थप्न सक्छु?"]],
  m:"I see your point, but I'm afraid I disagree. Online classes are useful, but students lose focus at home. Sorry to interrupt, but could I add something? In a real classroom, we can ask questions at once. So, I think both methods should be mixed.",
  mn:"अनलाइन कक्षाबारे विनम्र असहमति र बीचमा बोल्ने तरिका।",
  k:[["Pair practice: debate 'Homework is useful' for 90 sec.","जोडीमा 'गृहकार्य उपयोगी छ' विषयमा ९० सेकेन्ड बहस गर्नुहोस्।"],["Disagree politely with three statements.","तीनओटा कथनसँग विनम्रतापूर्वक असहमत हुनुहोस्।"]],
  q:{q:"To interrupt politely:",o:["Shut up.","Sorry to interrupt, but...","Wait, you are wrong."],a:1,n:"'Sorry to interrupt, but...' विनम्र तरिका हो।"} },
 { t:["Describing People & Places","व्यक्ति र ठाउँको वर्णन"], g:["Describe a person and a place with rich details.","व्यक्ति र ठाउँको विस्तृत वर्णन गर्ने।"],
  p:[["She is tall, friendly and very hardworking.","उनी अग्ली, मिलनसार र धेरै मेहनती छिन्।"],["He looks like his father.","ऊ आफ्नो बुबा जस्तै देखिन्छ।"],["My village is surrounded by green fields.","मेरो गाउँ हरिया खेतहरूले घेरिएको छ।"],["It is famous for...","यो ... का लागि प्रसिद्ध छ।"],["What I like most about it is...","मलाई यसमा सबैभन्दा मन पर्ने कुरा..."]],
  m:"My teacher is a tall and friendly man. He is very hardworking and always smiles. What I like most about him is that he explains difficult things in a simple way. My town, Taulihawa, is famous for its history. It is surrounded by green fields, and the people are kind.",
  mn:"मनपर्ने शिक्षक र आफ्नो सहरको वर्णन।",
  k:[["Describe the person you admire most (90 sec).","सबैभन्दा प्रशंसा गर्ने व्यक्तिको वर्णन ९० सेकेन्ड गर्नुहोस्।"],["Describe a famous place near you.","नजिकको प्रसिद्ध ठाउँको वर्णन गर्नुहोस्।"]],
  q:{q:"Which sentence is correct?",o:["She is tall and friendly.","She are tall and friendly.","She tall and friendly is."],a:0,n:"She सँग 'is' र शब्दक्रम: subject + is + adjective।"} },
 { t:["Keep Talking Without Stopping","नअड्किई बोलिरहने कला"], g:["Rescue yourself when you forget a word and keep the flow.","शब्द बिर्सँदा रोकिनुको सट्टा वाक्य जोगाएर बोल्ने।"],
  p:[["What I mean is...","मैले भन्न खोजेको..."],["Let me put it another way.","अर्को तरिकाले भनौँ।"],["How can I say this...","कसरी भनौँ यो..."],["The thing is...","कुरा के हो भने..."],["To sum up...","सारांशमा भन्नुपर्दा..."]],
  m:"The thing is, I forgot the English word, but let me put it another way. It is a place where people borrow books. What I mean is, a library. To sum up, when you forget a word, explain it with simple words and keep going.",
  mn:"शब्द बिर्सिए सरल शब्दमा व्याख्या गरेर बोल्न जारी राख्ने उदाहरण।",
  k:[["Explain five objects without saying their names (2 min).","पाँचओटा वस्तुको नाम नभनी वर्णन गर्नुहोस् (२ मिनेट)।"],["Speak non-stop on 'My dream' for 2 minutes.","'मेरो सपना' विषयमा २ मिनेट नरोकिई बोल्नुहोस्।"]],
  q:{q:"If you forget a word you should:",o:["Stop and stay silent","Say 'Let me put it another way' and explain","Switch to Nepali completely"],a:1,n:"शब्द बिर्सिए अर्को तरिकाले व्याख्या गर्नुहोस्; रोकिनुहुँदैन।"} }
 ]},
{ n:4, icon:"🎓", t:"Real-Life, Academic & Professional English", s:"दैनिक जीवन, शैक्षिक परिवेश र कार्यक्षेत्र/अफिसमा चाहिने अंग्रेजी", target:[120,180], lab:"2–3 minutes",
 lessons:[
 { t:["Classroom & Campus English","कक्षाकोठा र क्याम्पस अंग्रेजी"], g:["Ask, answer and discuss ideas in class and with teachers.","कक्षामा र शिक्षकसँग प्रश्न, जवाफ र छलफल गर्ने।"],
  p:[["May I come in, sir?","सर, म भित्र आउन सक्छु?"],["Could you please explain it once more?","कृपया एक पटक फेरि बुझाइदिनुहुन्छ?"],["I would like to submit my assignment.","म मेरो असाइनमेन्ट बुझाउन चाहन्छु।"],["Our research topic is...","हाम्रो अनुसन्धानको विषय ... हो।"],["I have a doubt regarding this concept.","यो अवधारणाबारे मलाई जिज्ञासा छ।"]],
  m:"Good morning, sir. May I come in? I would like to submit my assignment on social change in Kapilvastu. Could you please explain the deadline once more? Also, I have a doubt regarding the research method. Our group wants to use a short questionnaire. Could you please guide us on the sample size? Thank you for your time, sir.",
  mn:"शिक्षकसँग असाइनमेन्ट र अनुसन्धान विधिबारे विनम्र कुराकानी।",
  k:[["Explain your assignment or research topic for 2 minutes.","आफ्नो असाइनमेन्ट वा अनुसन्धान विषय २ मिनेट बुझाउनुहोस्।"],["Explain a concept you learned this week to a friend.","यो हप्ता सिकेको अवधारणा साथीलाई बुझाउनुहोस्।"]],
  q:{q:"Which is a polite classroom request?",o:["Explain again.","Could you please explain it once more?","You didn't explain."],a:1,n:"'Could you please...?' शिक्षकसँग उपयुक्त अनुरोध हो।"} },
 { t:["Giving a Presentation","प्रस्तुति दिने"], g:["Open, structure and close a short presentation.","छोटो प्रस्तुति सुरु, व्यवस्थित र समापन गर्ने।"],

 { t:["Job Interview","जागिर अन्तर्वार्ता"], g:["Answer common interview questions with confidence.","सामान्य अन्तर्वार्ता प्रश्नको आत्मविश्वासका साथ उत्तर दिने।"],

  p:[["Let's get started with the agenda.","कार्यसूचीबाट सुरु गरौँ।"],["I'll send you the report by Friday.","म शुक्रबारसम्म प्रतिवेदन पठाउँछु।"],["Could we schedule a meeting?","हामी बैठक तय गर्न सक्छौँ?"],["I'd like to update you on the progress.","म प्रगतिबारे जानकारी दिन चाहन्छु।"],["Let's follow up next week.","अर्को हप्ता फेरि छलफल गरौँ।"]],

 { t:["Group Discussion & Debate","समूह छलफल र वादविवाद"], g:["Support an argument with evidence and respond to others.","तर्कलाई प्रमाणले समर्थन गर्ने र अरूलाई जवाफ दिने।"],

 { t:["Your Life Story","आफ्नो जीवनकथा"], g:["Tell your story with turning points and lessons learned.","मोड र सिकाइसहित आफ्नो कथा सुनाउने।"],

 { t:["Teach a Topic You Know","आफूले जानेको विषय सिकाउने"], g:["Explain something clearly step by step.","कुनै कुरा चरणबद्ध रूपमा स्पष्ट बुझाउने।"],
  p:[["Today I'll explain how...","आज म ... कसरी हुन्छ बुझाउँछु।"],["Imagine that...","कल्पना गर्नुहोस् कि..."],["Let me break it down into steps.","यसलाई चरणमा बाँडेर बुझाउँछु।"],["A common mistake is...","सामान्य गल्ती..."],["To put it simply...","सजिलो भाषामा भन्दा..."]],

function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function touch(){ const t=today(); if(!S.days.includes(t)){ S.days.push(t); if(S.days.length>400) S.days=S.days.slice(-400); } }
function streak(){
  const set=new Set(S.days); let n=0; const d=new Date();
  const f=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!set.has(f(d))) d.setDate(d.getDate()-1);
  while(set.has(f(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function say(text,rate){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const m=new SpeechSynthesisUtterance(text); m.lang="en-US"; m.rate=rate||0.95;
    speechSynthesis.speak(m);
  }catch(e){}
}

function pickQ(){
  const all=[]; VOL.forEach((v,vi)=>v.lessons.forEach((ls,li)=>all.push(ls.q)));

  QZ.cur=q; QZ.pick=null;
}
function quizBlock(){
  if(!QZ.cur) pickQ();

  const opts=q.o.map((o,i)=>{

    return `<button class="${cls}" data-act="qq" data-i="${i}" ${pk!=null?"disabled":""}>${esc(o)}</button>`;
  }).join("");
  const fb=pk!=null?`<p><b>${pk===q.a?"✅":"❌"}</b> <span class="ne">${esc(q.n)}</span></p><button class="btn" data-act="nextQ">${u("next")}</button>`:"";

}

  const how=S.lang==="ne"
   ?["१. पाठ खोल्नुहोस् र 🔊 थिचेर प्रत्येक वाक्यांश सुन्नुहोस्।","२. ठूलो स्वरमा दोहोर्‍याउनुहोस् — पहिले ढिलो, पछि स्वाभाविक गतिमा।","३. बोल्ने अभ्यासमा टाइमर चलाएर लक्ष्य समयभित्र बोल्नुहोस्।","४. क्विज हल गरी पाठ पूरा भएको जनाउनुहोस्।","५. दिनदिनै कम्तीमा एक सत्र बोल्नुहोस् — निरन्तरता नै कुञ्जी हो।"]
   :["1. Open a lesson and tap 🔊 to hear each phrase.","2. Repeat aloud — slowly first, then at natural speed.","3. Use the speaking timer and aim for your volume's target time.","4. Take the quiz and mark the lesson complete.","5. Speak at least one session every day — consistency is the key."];
  return `<h2>${u("about")}</h2>
  <div class="card"><h3>📚 English Speaking Course: A to Z</h3><p>A Practical Speaking Course for Nepali Learners<br><b>Padam Raj Pant</b></p></div>
  <h3>${u("howto")}</h3><div class="card">${how.map(h=>`<p>${esc(h)}</p>`).join("")}</div>
  ${rows}
  <div class="card flat"><p class="muted" style="font-size:.9rem">${S.lang==="ne"?"टिप: आवाज सुन्ने र लाइभ ट्रान्सक्रिप्टका लागि क्रोम वा सफारी जस्ता आधुनिक ब्राउजर राम्रो हुन्छ। तपाईंको प्रगति यही उपकरणमा मात्र सुरक्षित हुन्छ।":"Tip: audio playback and live transcript work best in a modern browser such as Chrome or Safari. Your progress is stored on this device only."}</p></div>
  ${credit()}`;
}
function credit(){
  return `<footer class="credit">${S.lang==="ne"
   ?"श्री बिष्णु सिंह रायमाझीद्वारा तयार — गणित प्रध्यापक तथा विभागीय प्रमुख, मानविकी तथा सामाजिक शास्त्र (KMC-HSSD), कपिलवस्तु बहुमुखी क्याम्पस, तौलिहवा। UCDL Academy · SDROK · त्रिभुवन विश्वविद्यालय।"
   :"Prepared by Mr. Bishnu Singh Rayamajhi — Math Lecturer & Head, Humanities and Social Sciences Department (KMC-HSSD), Kapilvastu Multiple Campus, Taulihawa. UCDL Academy · SDROK · Tribhuvan University."}</footer>`;
}

/* ================= RENDER ================= */
const NAV=[["home","🏠"],["course","📖"],["practice","🎙️"],["progress","📈"],["about","ℹ️"]];
function render(scroll){
  const main=document.getElementById("main");
  const V={home:vHome,course:vCourse,lesson:vLesson,practice:vPractice,progress:vProgress,about:vAbout};
  main.innerHTML=V[view]();
  const cur=view==="lesson"?"course":view;
  document.getElementById("tabs").innerHTML=NAV.map(n=>`<button data-act="nav" data-view="${n[0]}" class="${n[0]===cur?"on":""}" ${n[0]===cur?'aria-current="page"':""}><span class="i">${n[1]}</span>${u(n[0])}</button>`).join("");
  document.documentElement.lang=S.lang==="ne"?"ne":"en";
  document.getElementById("langBtn").textContent=S.lang==="ne"?"नेपा | EN":"EN | नेपा";
  if(view==="practice") tick(true);
  if(scroll) window.scrollTo(0,0);
}
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme");
}

/* ================= TIMER ================= */
function tick(paint){
  const v=VOL[P.vol];
  if(P.running) P.el=(performance.now()-P.t0)/1000;
  const tm=document.getElementById("tm"); if(!tm) return;
  tm.textContent=fmt(P.el);
  const scale=v.target[1]*1.3, w=Math.min(100,100*P.el/scale);
  const f=document.getElementById("fill"); if(f) f.style.width=w+"%";
  const zt=document.getElementById("zt");
  if(zt){
    if(!P.running&&P.el===0){ zt.textContent=""; }
    else if(P.el<v.target[0]){ zt.textContent=u("keepOn"); zt.style.color="var(--muted)"; }
    else if(P.el<=v.target[1]){ zt.textContent=u("good"); zt.style.color="var(--ok)"; }
    else { zt.textContent=u("over"); zt.style.color="var(--orange)"; }
  }
  if(P.running&&P.mic){ const n=document.getElementById("live"); if(n) n.textContent=(P.fin+P.int).trim(); }
}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!P.mic) return;
  try{
    const r=new SR(); r.lang="en-US"; r.continuous=true; r.interimResults=true;
    r.onresult=ev=>{ let fin="",int=""; for(let i=0;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin+=t+" "; else int+=t; } P.fin=fin; P.int=int; };
    r.onend=()=>{ if(P.running&&P.rec===r){ try{ r.start(); }catch(e){} } };
    r.onerror=()=>{};
    r.start(); P.rec=r;
  }catch(e){ P.rec=null; }
}
function stopRec(){ const r=P.rec; P.rec=null; if(r){ try{ r.stop(); }catch(e){} } }
function startT(){
  P.running=true; P.result=null; P.saved=false; P.fin=""; P.int=""; P.el=0; P.t0=performance.now();
  clearInterval(P.timer); P.timer=setInterval(()=>tick(),250);
  startRec(); render();
}
function stopT(){
  tick(); P.running=false; clearInterval(P.timer); stopRec();
  const v=VOL[P.vol], sec=P.el, txt=(P.fin+P.int).trim();
  const words=txt?txt.split(/\s+/).filter(Boolean).length:0;
  const wpm=words&&sec>5?Math.round(words/(sec/60)):0;
  P.result={sec:sec,ok:sec>=v.target[0]&&sec<=v.target[1],words:words,wpm:wpm};
  render();
}
function resetT(){ P.running=false; clearInterval(P.timer); stopRec(); P.el=0; P.result=null; P.fin=""; P.int=""; render(); }

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="mic") return;
  if(a==="nav"){ if(P.running) return; view=el.dataset.view; resetArm=false; render(true); }
  else if(a==="vol"){ cv=+el.dataset.v; view="course"; render(true); }
  else if(a==="lesson"){ cv=+el.dataset.v; cl=+el.dataset.l; view="lesson"; render(true); }
  else if(a==="lang"){ S.lang=S.lang==="ne"?"en":"ne"; save(); render(); }
  else if(a==="theme"){ const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&!matchMedia("(prefers-color-scheme: light)").matches); S.theme=dark?"light":"dark"; applyTheme(); save(); }
  else if(a==="say"){ say(el.dataset.text,el.dataset.rate?+el.dataset.rate:0.95); }
  else if(a==="done"){ const id=lid(cv,cl); S.done[id]=!S.done[id]; if(S.done[id]) touch(); save(); render(); }
  else if(a==="lq"){ const id=lid(cv,cl); if(LQ[id]!=null) return; const i=+el.dataset.i; LQ[id]=i; S.qa++; if(i===VOL[cv].lessons[cl].q.a) S.qc++; touch(); save(); render(); }
  else if(a==="tryTask"){ P.vol=+el.dataset.v; P.prompt=VOL[P.vol].lessons[cl].k[+el.dataset.i]; P.el=0; P.result=null; view="practice"; render(true); }
  else if(a==="pvol"){ P.vol=+el.dataset.v; P.el=0; P.result=null; P.prompt=null; render(); }
  else if(a==="prompt"){
    const ls=VOL[P.vol].lessons, l=ls[Math.floor(Math.random()*ls.length)], k=l.k[Math.floor(Math.random()*l.k.length)];
    P.prompt=k; render();
  }
  else if(a==="toggleT"){ P.running?stopT():startT(); }
  else if(a==="resetT"){ resetT(); }
  else if(a==="saveSess"){ if(!P.result||P.saved) return; S.sess.push({ts:Date.now(),v:P.vol,sec:Math.round(P.result.sec),words:P.result.words,wpm:P.result.wpm,ok:P.result.ok}); if(S.sess.length>100) S.sess=S.sess.slice(-100); touch(); save(); P.saved=true; render(); }
  else if(a==="qq"){ if(QZ.pick!=null) return; QZ.pick=+el.dataset.i; S.qa++; if(QZ.pick===QZ.cur.a) S.qc++; touch(); save(); render(); }
  else if(a==="nextQ"){ pickQ(); render(); }
  else if(a==="resetAll"){ if(!resetArm){ resetArm=true; render(); return; } S.done={}; S.qa=0; S.qc=0; S.sess=[]; S.days=[]; LQ={}; resetArm=false; save(); render(); }
});
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="micChk"){
    P.mic=e.target.checked;
    const n=document.getElementById("live"); if(n) n.hidden=!P.mic;
    if(P.mic&&!(window.SpeechRecognition||window.webkitSpeechRecognition)){
      if(n){ n.hidden=false; n.textContent=S.lang==="ne"?"यो ब्राउजरमा लाइभ ट्रान्सक्रिप्ट समर्थित छैन। टाइमर अझै काम गर्छ।":"Live transcript is not supported in this browser. The timer still works."; }
    }
  }
});

applyTheme();
render();
</script>
</body>
</html>
