{id:"l1",f:"Body • Kāyānupassanā",ne:"काय",t:{en:"Mindfulness of Breathing (Ānāpānasati)",ne:"आनापानसति"},obj:"Know the natural breath as it is.",ex:"Sit upright, relaxed. Breathe naturally. Know a long breath as long and a short breath as short; then feel the whole breath body; let the body process calm — never forcing or holding the breath.",ref:"Where is the breath most clear right now: nostrils, chest or abdomen?",key:["Natural breathing","Long / short","Whole breath body","Calming"],src:"Satipaṭṭhāna Sutta, Kāyānupassanā"},

$("#fz").onclick=()=>{S.fs=S.fs>=1.4?1:+(S.fs+.15).toFixed(2);save();applyPrefs()};
$("#rm").onclick=()=>{S.rm=S.rm?"":"on";save();applyPrefs()};

/* ===== STATS ===== */
function stats(){const d=[...new Set(S.sessions.map(s=>s.d))].sort();let cur=0,best=0,run=0,prev=null;
for(const x of d){run=prev&&(new Date(x)-new Date(prev))/864e5===1?run+1:1;best=Math.max(best,run);prev=x}
const t=new Date(today());let c=d.includes(today())?today():new Date(t-864e5).toISOString().slice(0,10);
while(d.includes(c)){cur++;c=new Date(new Date(c)-864e5).toISOString().slice(0,10)}
const mins=S.sessions.reduce((a,s)=>a+s.m,0),wk=S.sessions.filter(s=>(t-new Date(s.d))/864e5<7).length,mo=S.sessions.filter(s=>s.d.slice(0,7)===today().slice(0,7)).length;
const qs=Object.values(S.quiz),avg=qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length):0;return{n:S.sessions.length,mins,cur,best,wk,mo,qn:qs.length,avg}}
const bar=p=>`<div class="pb" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;

/* ===== TIMER ===== */
let tm={dur:10,mode:0,left:0,end:0,run:false,iv:null,bell:5,silent:false};
const MODES=["Simple Awareness — observe natural breathing","Counting — count breaths 1 to 10, repeat","Following — continuous awareness of the breath","Whole-Breath — know beginning, middle, end of each breath","Calming — gently calm awareness; never force the breath"];
function bell(){if(tm.silent)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=528;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.4,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+3);o.start();o.stop(a.currentTime+3)}catch(e){}}
function toast(m){const d=document.createElement("div");d.setAttribute("role","status");d.textContent=m;d.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:90%";document.body.append(d);setTimeout(()=>d.remove(),4000)}
function tick(){if(!tm.run)return;tm.left=Math.max(0,Math.round((tm.end-Date.now())/1e3));draw();
if(tm.bell&&tm.left>0&&(tm.dur*60-tm.left)%(tm.bell*60)===0&&tm.left<tm.dur*60)bell();
if(tm.left<=0){clearInterval(tm.iv);tm.run=false;bell();S.sessions.push({d:today(),m:tm.dur,mode:tm.mode});save();toast(T().done);tm.left=0;go("timer",1)}}
function draw(){const e=$("#tt");if(!e)return;const tot=tm.dur*60,p=tot?(tot-tm.left)/tot:0;e.textContent=String(Math.floor(tm.left/60)).padStart(2,"0")+":"+String(tm.left%60).padStart(2,"0");$("#rc").setAttribute("stroke-dashoffset",691*(1-p))}
function tStart(){if(!tm.left)tm.left=tm.dur*60;tm.end=Date.now()+tm.left*1e3;tm.run=true;bell();clearInterval(tm.iv);tm.iv=setInterval(tick,500);go("timer",1)}
function tPause(){tm.run=false;clearInterval(tm.iv);go("timer",1)}
function tStop(){tm.run=false;clearInterval(tm.iv);tm.left=0;go("timer",1)}
function quick(m){tm.dur=m;tm.left=0;go("timer")}
window.quick=quick;window.tStart=tStart;window.tPause=tPause;window.tStop=tStop;

/* ===== PAGES ===== */
let page="home",qState=null;
const NAV=["home","timer","lessons","prog","quiz","journal","stats","gloss","lib","search","about"];
function go(p,keep){page=p;$("#nav").innerHTML=NAV.map(k=>`<button data-p="${k}" ${k===p?'aria-current="page"':""}>${T()[k]}</button>`).join("");
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));$("#app").innerHTML=R[p]();if(p==="timer")draw();if(!keep)$("#app").focus({preventScroll:true});bind()}
const R={
home(){return`<div class="hero"><div class="lotus" aria-hidden="true"></div><h2>${CFG.name}</h2><p>Discover mindfulness through the Four Foundations of Mindfulness.<br><span class="mut">Learn • Practice • Observe • Understand • Progress</span></p>
<div class="row" style="justify-content:center"><button class="btn" onclick="quick(10)">${T().timer}</button><button class="btn alt" onclick="go('lessons')">${T().lessons}</button></div></div>
<div class="card"><h3>Quick start</h3><div class="row">${[5,10,15,20,30,45,60].map(m=>`<button class="btn alt" onclick="quick(${m})">${m} ${T().min}</button>`).join("")}</div></div>
<div class="card"><h3>Learn → Practice → Reflect → Test → Track</h3><p class="mut">Body → Feeling → Mind → Mental Objects. Primary beginner practice: Observe → Know → Understand → Let Go.</p></div>`},
timer(){const m=MODES.map((x,i)=>`<option value="${i}" ${i===tm.mode?"selected":""}>${x}</option>`).join("");
return`<h2>${T().timer}</h2><div class="card"><div class="ring"><svg width="240" height="240" aria-hidden="true"><circle cx="120" cy="120" r="110" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="rc" cx="120" cy="120" r="110" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="691" stroke-dashoffset="691"/></svg><div class="t" id="tt" role="timer" aria-live="off">${String(tm.dur).padStart(2,"0")}:00</div></div>
<div class="row" style="justify-content:center;margin-top:12px">${tm.run?`<button class="btn" onclick="tPause()">${T().pause}</button>`:`<button class="btn" onclick="tStart()">${tm.left&&tm.left<tm.dur*60?T().resume:T().start}</button>`}<button class="btn alt" onclick="tStop()">${T().stop}</button></div></div>
<div class="card"><label>Duration (min)<select id="dur">${[5,10,15,20,30,45,60].map(x=>`<option ${x===tm.dur?"selected":""}>${x}</option>`).join("")}</select></label>
<label>Mode<select id="mode">${m}</select></label><label>Interval bell (min, 0 = off)<input id="ib" type="number" min="0" max="30" value="${tm.bell}"></label>
<label><input type="checkbox" id="sl" style="width:auto" ${tm.silent?"checked":""}> Silent mode</label></div>
<div class="card"><h3>Posture &amp; instructions</h3><p>Sit comfortably upright, close the eyes or lower the gaze, set the intention to observe. Breathe naturally and never hold or force the breath. ${MODES[tm.mode]}.</p><p class="mut">Audio guidance: text scripts only in this version (audio placeholder: assets/audio/).</p></div>`},
lessons(){return`<h2>${T().lessons}</h2>`+LESSONS.map(l=>`<div class="card"><div class="mut">${l.f} (${l.ne})</div><h3>${esc(tt(l.t))}</h3><p><b>Objective:</b> ${esc(l.obj)}</p><p><b>Practice:</b> ${esc(l.ex)}</p><p><b>Reflect:</b> ${esc(l.ref)}</p><p class="mut">Key: ${l.key.join(" · ")} | Source: ${esc(l.src)}</p>
<div class="mut"><b>📄 Teaching &amp; learning resources</b></div><ul>${(LRES[l.id]||[]).map(k=>`<li>${R_[k][0]}: <a href="${R_[k][2]}" target="_blank" rel="noopener">${R_[k][1]}</a></li>`).join("")}<li>Video: <a href="${yt(l.t.en+" meditation teaching talk")}" target="_blank" rel="noopener">YouTube search — ${esc(l.t.en)}</a> <span class="mut">(search results; check each uploader and license)</span></li></ul><button class="btn ${S.lessons.includes(l.id)?"alt":""}" data-l="${l.id}">${S.lessons.includes(l.id)?"✓ Completed":"Mark complete"}</button></div>`).join("")},
prog(){const mk=(n)=>{const days=PROG[n];const d=S.prog[n];return`<div class="card"><h3>${n}-Day Program</h3>${bar(Math.round(d.length/n*100))}<p class="mut">${d.length}/${n} days${d.length===n?" — 🎓 Certificate of Learning/Practice Completion (not a Buddhist ordination or teacher certification)":""}</p>`+days.map((x,i)=>`<div class="row"><button class="btn ${d.includes(i)?"":"alt"}" data-d="${n}-${i}" style="min-height:40px">${d.includes(i)?"✓":"○"} Day ${i+1}</button><span>${x} · ${[5,10,10,15,15,20,20][i%7]} ${T().min}</span></div>`).join("")+`</div>`};
return`<h2>${T().prog}</h2>${mk(7)}${mk(14)}<div class="card"><h3>30-Day Program</h3><p class="mut">Extend the 14-day sequence by repeating each foundation for several days. Edit PROG in the code to add days.</p></div>`},
quiz(){if(!qState)return`<h2>${T().quiz}</h2><div class="card"><p>${QUIZ.length} questions: multiple choice, true/false and scenarios.</p><button class="btn" onclick="qStart()">${T().start}</button><p class="mut">Last score: ${S.quiz.last??"—"}%</p></div>`;
const s=qState;if(s.i>=QUIZ.length){const p=Math.round(s.sc/QUIZ.length*100);const w=s.wrong.map(i=>`<div class="card"><b>${esc(QUIZ[i].q)}</b><p>Answer: ${esc(QUIZ[i].o[QUIZ[i].a])}<br>${esc(QUIZ[i].e)}</p></div>`).join("");return`<h2>Score: ${s.sc}/${QUIZ.length} (${p}%)</h2><button class="btn" onclick="qStart()">Retry Quiz</button>${w?`<h3>Review Incorrect Answers</h3>${w}`:"<p>Perfect!</p>"}`}
const q=QUIZ[s.i];return`<h2>${s.i+1}/${QUIZ.length} <span class="mut">${q.c}</span></h2><div class="card"><p><b>${esc(q.q)}</b></p>${q.o.map((o,i)=>`<button class="opt" data-o="${i}" ${s.a!=null?"disabled":""}>${esc(o)}</button>`).join("")}${s.a!=null?`<p>${esc(q.e)}</p><button class="btn" onclick="qNext()">Next</button>`:""}</div>`},
journal(){const f=($("#jq")||{}).value||"";const L=S.journal.filter(j=>JSON.stringify(j).toLowerCase().includes(f.toLowerCase()));
return`<h2>${T().journal}</h2><p class="mut">Journal entries remain on this device unless you export them.</p><div class="card"><label>Date<input type="date" id="jd" value="${today()}"></label><label>Duration (min)<input type="number" id="jm" value="${tm.dur}"></label>
${["What did I notice?","What feelings arose?","What thoughts arose?","What was difficult?","What did I learn?","Personal reflection"].map((x,i)=>`<label>${x}<textarea rows="2" id="j${i}"></textarea></label>`).join("")}<button class="btn" id="js">Save entry</button> <button class="btn alt" id="je">Export</button></div>
<input id="jq" placeholder="Search journal…" value="${esc(f)}">`+L.map(j=>`<div class="card"><b>${j.d}</b> · ${j.m} ${T().min}<p>${j.a.map(esc).join("<br>")}</p><button class="btn alt" data-jx="${j.id}">Delete</button></div>`).join("")},
stats(){const s=stats();const c=(a,b)=>`<div class="card"><div class="mut">${a}</div><h3>${b}</h3></div>`;const f=["Body","Feeling","Mind","Mental objects"].map(n=>{const ls=LESSONS.filter(l=>l.f.startsWith(n));return`<div>${n} ${bar(Math.round(ls.filter(l=>S.lessons.includes(l.id)).length/ls.length*100))}</div>`}).join("");
return`<h2>${T().stats}</h2><div class="grid">${c("Sessions",s.n)}${c("Minutes",s.mins)}${c("Streak",s.cur)}${c("Longest",s.best)}${c("This week",s.wk)}${c("This month",s.mo)}${c("Lessons",S.lessons.length+"/"+LESSONS.length)}${c("Quizzes / avg",s.qn?"avg "+s.avg+"%":"—")}</div><div class="card"><h3>Four Foundations</h3>${f}</div><div class="card"><button class="btn alt" id="rs">Reset progress</button> <button class="btn alt" id="ex">Export data</button></div>`},
gloss(){return`<h2>${T().gloss}</h2><input id="gq" placeholder="Search…">`+`<div id="gl">${glist("")}</div>`},
lib(){const fl=["All","Beginner","Intermediate","Breathing","Satipaṭṭhāna","Vipassana","English","Nepali"];
const V=VIDEOS.filter(v=>vf==="All"||v.level===vf||v.topic.includes(vf)||v.language===vf);
return`<h2>${T().lib}</h2><p class="mut">Only legitimately accessible sources are linked; nothing is copied or embedded. Check each source's license. Add items to LIB / VIDEOS in the code.</p><h3>📄 Free Buddhist PDF &amp; text library</h3>`+LIB.map(r=>`<div class="card"><h3>${esc(r.title)}</h3><p>${esc(r.author)} · ${r.type} · ${r.language} · ${esc(r.topic)}<br>Source: ${esc(r.source)}<br>License: ${esc(r.license)}</p><a class="btn" href="${r.url}" target="_blank" rel="noopener">${r.type==="PDF"?"Open / download PDF":"Original source"}</a></div>`).join("")+`<h3>🎥 Video &amp; talk library</h3><div class="chips">${fl.map(f=>`<button class="btn ${f===vf?"":"alt"}" style="min-height:36px;padding:6px 12px" data-vf="${f}">${f}</button>`).join("")}</div>`+(V.map(v=>`<div class="card"><div class="mut">${v.kind} · ${v.level} · ${v.language} · ${v.dur}</div><h3>${esc(v.title)}</h3><p>${esc(v.teacher)} · ${esc(v.topic)}<br>Source: ${esc(v.source)}<br>License: ${esc(v.license)}</p><a class="btn" href="${v.url}" target="_blank" rel="noopener">Open on source site</a></div>`).join("")||"<p>No items for this filter.</p>")},
search(){return`<h2>${T().search}</h2><input id="sq" placeholder="Lessons, glossary, library…"><div id="sr"></div>`},
about(){return`<h2>Buddhist Sources &amp; Attribution</h2><div class="card"><p>Principal source for the structure: Nyanasatta Thera (trans.), <i>The Foundations of Mindfulness: Satipaṭṭhāna Sutta</i>, via Access to Insight / Buddhist Publication Society. <a href="https://www.accesstoinsight.org/tipitaka/mn/mn.010.nysa.html" target="_blank" rel="noopener">Source page</a></p>
<p>This application is an educational and meditation-learning project based on traditional Buddhist teachings concerning mindfulness, breathing meditation and the Four Foundations of Mindfulness. It is not an official publication of the Buddhist Publication Society, Access to Insight, or any particular meditation organization.</p>
<p>All explanations are original app wording; the translation is not reproduced. Traditional teachings are distinct from modern research; no guaranteed outcomes or medical claims are made. Not a substitute for a qualified teacher or health professional.</p>
<p><b>Privacy:</b> no tracking or accounts; progress and journal stay in this browser's localStorage.</p><p class="mut">${CFG.credit}</p></div>`}};
const glist=f=>GLOSS.filter(g=>g.join(" ").toLowerCase().includes(f.toLowerCase())).map(g=>`<div class="card"><h3>${g[0]} <span class="mut">${g[1]}</span></h3><p>${g[2]}</p></div>`).join("");

window.qStart=()=>{qState={i:0,sc:0,wrong:[],a:null};go("quiz")};
window.qNext=()=>{qState.i++;qState.a=null;if(qState.i>=QUIZ.length){const p=Math.round(qState.sc/QUIZ.length*100);S.quiz["q"+Date.now()]=p;S.quiz.last=p;save()}go("quiz")};
window.go=go;
function bind(){const A=$("#app");
A.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=b.dataset.l;S.lessons=S.lessons.includes(i)?S.lessons.filter(x=>x!==i):[...S.lessons,i];save();go("lessons",1)});
A.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const[n,i]=b.dataset.d.split("-").map(Number),d=S.prog[n];S.prog[n]=d.includes(i)?d.filter(x=>x!==i):[...d,i];save();go("prog",1)});
A.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o,q=QUIZ[qState.i];qState.a=i;if(i===q.a)qState.sc++;else qState.wrong.push(qState.i);go("quiz",1)});
if(page==="timer"){$("#dur").onchange=e=>{tm.dur=+e.target.value;tm.left=0;go("timer",1)};$("#mode").onchange=e=>tm.mode=+e.target.value;$("#ib").onchange=e=>tm.bell=Math.max(0,+e.target.value||0);$("#sl").onchange=e=>tm.silent=e.target.checked}
if(page==="journal"){$("#js").onclick=()=>{S.journal.unshift({id:Date.now(),d:$("#jd").value,m:+$("#jm").value||0,a:[0,1,2,3,4,5].map(i=>$("#j"+i).value)});save();toast("Saved");go("journal",1)};
$("#jq").oninput=()=>{const v=$("#jq").value;go("journal",1);const e=$("#jq");e.value=v;e.focus()};$("#je").onclick=()=>dl("journal.json",S.journal);
A.querySelectorAll("[data-jx]").forEach(b=>b.onclick=()=>{if(confirm("Delete this entry?")){S.journal=S.journal.filter(j=>j.id!=b.dataset.jx);save();go("journal",1)}})}
if(page==="stats"){$("#rs").onclick=()=>{if(confirm("Reset all local progress?")){const l=S.lang;localStorage.removeItem(K);S={lang:l,theme:S.theme,fs:S.fs,rm:S.rm,sessions:[],lessons:[],quiz:{},prog:{7:[],14:[]},journal:[]};save();go("stats")}};$("#ex").onclick=()=>dl("meditation-data.json",S)}
if(page==="lib")A.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{vf=b.dataset.vf;go("lib",1)});
if(page==="gloss")$("#gq").oninput=e=>$("#gl").innerHTML=glist(e.target.value);
if(page==="search")$("#sq").oninput=e=>{const f=e.target.value.toLowerCase();if(!f){$("#sr").innerHTML="";return}const r=[...LESSONS.filter(l=>JSON.stringify(l).toLowerCase().includes(f)).map(l=>["Lesson",tt(l.t),l.obj,"lessons"]),...GLOSS.filter(g=>g.join(" ").toLowerCase().includes(f)).map(g=>["Glossary",g[0],g[2],"gloss"]),...LIB.concat(VIDEOS).filter(x=>JSON.stringify(x).toLowerCase().includes(f)).map(x=>["Library",x.title,x.source,"lib"])];
$("#sr").innerHTML=r.map(x=>`<div class="card"><span class="mut">${x[0]}</span><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p><button class="btn alt" onclick="go('${x[3]}')">Open</button></div>`).join("")||"<p>No results.</p>"}}
function dl(n,o){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));a.download=n;a.click()}
applyPrefs();go("home");
</script></body></html>
