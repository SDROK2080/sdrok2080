// ---------- Math / stat utilities ----------
function evalExpr(expr, x) {
  try {
    let s = expr.replace(/\^/g,'**').replace(/\bpi\b/gi, Math.PI.toString());
    s = s.replace(/(\d)(x)/g, '$1*$2');
    s = s.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
         .replace(/sqrt\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/log\(/g,'Math.log(')
         .replace(/\be\*\*/g, Math.E+'**');
    s = s.replace(/\bx\b/g, '('+x+')');
    // eslint-disable-next-line no-new-func
    return Function('Math', 'return ' + s)(Math);
  } catch (e) { return NaN; }
}
function deriv(f, x, h) { h = h || 1e-4; return (f(x+h)-f(x-h))/(2*h); }
function round(n, d) { const p = Math.pow(10, d); return Math.round(n*p)/p; }
function mean(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }
function median(arr) { const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2? s[m] : (s[m-1]+s[m])/2; }
function modeOf(arr) { const f={}; let mx=0,md=arr[0]; arr.forEach(v=>{f[v]=(f[v]||0)+1; if(f[v]>mx){mx=f[v]; md=v;}}); return md; }
function stdev(arr) { const m=mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)**2))); }
function toRad(d){ return d*Math.PI/180; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    differentiation: 'For '+(inp.level||'mixed-level')+' learners: scaffold problems for students who need support, and offer one HOTS extension for early finishers.'
  };
}
function aiWorksheet(inp) {
  const n = inp.num||8, topic = inp.topic, diff = inp.difficulty||'medium';
  const types = (inp.types && inp.types.length) ? inp.types : ['mcq','short','numeric'];
  const gens = {
    mcq: (i)=>({type:'MCQ', q:'Which statement best represents a key property of '+topic+'? ('+diff+')', opts:['Correct relationship','Common misconception','Partially correct','Unrelated concept'], marks: diff==='hard'?2:1, sol:'Option A correctly reflects the standard rule for '+topic+'.'}),
    short: (i)=>({type:'Short Answer', q:'Briefly state and explain one key rule used when working with '+topic+'. ('+diff+')', marks:2, sol:'Model answer: state the rule precisely with one supporting example.'}),
    numeric: (i)=>({type:'Numerical', q:'Solve a standard numerical problem involving '+topic+'. Show all working. ('+diff+')', marks: diff==='hard'?4:3, sol:'Step 1: Identify given values. Step 2: Apply the formula for '+topic+'. Step 3: Simplify.'}),
    long: (i)=>({type:'Long Answer', q:'Derive a key result related to '+topic+', then apply it to solve a follow-up problem.', marks:5, sol:'Present the derivation in logical steps, then substitute given values.'}),
    application: (i)=>({type:'Application', q:'A real-world scenario requiring '+topic+' to solve — set up and solve mathematically.', marks:4, sol:'Translate the scenario into a model using '+topic+', solve, and interpret.'}),
    hots: (i)=>({type:'HOTS', q:'A higher-order thinking challenge combining '+topic+' with a related concept. Justify each step.', marks:5, sol:'Requires connecting '+topic+' with another concept; award marks for valid reasoning.'}),
  };
  const qs = [];
  for (let i=0;i<n;i++){ const t = types[i%types.length]; qs.push(gens[t] ? gens[t](i+1) : gens.mcq(i+1)); }
  return {title: topic+' — Practice Worksheet', questions: qs};
}
function aiQuestionPaper(inp) {
  const n = inp.num || 12;
  const mk = (count, text, marks) => Array.from({length: Math.max(1,count)}, (_,i)=>({num:i+1, text, marks}));
  return {
    subject: inp.subject, program: inp.program+', '+inp.yearSem, fullMarks: inp.fullMarks, time: inp.time,
    sections: [
      {name:'Section A', instr:'Very short answer questions. Attempt all questions.', qs: mk(Math.ceil(n*0.4), 'Define / state a key concept from '+inp.subject+'.', 1)},
      {name:'Section B', instr:'Short-answer questions. Attempt any of the following.', qs: mk(Math.ceil(n*0.35), 'Solve a standard problem from '+inp.subject+' showing all steps.', 5)},
      {name:'Section C', instr:'Long-answer / analytical questions. Attempt any of the following.', qs: mk(Math.max(1,Math.floor(n*0.25)), 'Derive the key result / solve the analytical problem from '+inp.subject+', and discuss its application.', 10)},
    ]
  };
}
function aiMCQs(topic, count, diff) {
  return Array.from({length:count}, (_,i)=>({
    q: '('+diff+') Which statement correctly applies to '+topic+'? [Question '+(i+1)+']',
    opts: ['Correct application of '+topic, 'A common misconception about '+topic, 'An unrelated mathematical rule', 'A partially correct but incomplete statement'],
    correct: 0,
    exp: 'The first option correctly reflects the standard definition/rule governing '+topic+'.'
  }));
}

// ---------- Shared UI helpers ----------
function Btn(label, opts) {
  opts = opts || {};
  const variant = opts.variant || 'primary';
  const cls = {primary:'btn-primary', gold:'btn-gold', outline:'btn-outline', ghost:'btn-ghost'}[variant];
  const extra = opts.class || '';
  const attrs = opts.attrs || '';
  const tag = opts.href ? 'a' : 'button';
  const hrefAttr = opts.href ? ('href="#'+opts.href+'"') : '';
  const disabled = opts.disabled ? 'disabled' : '';
  return '<'+tag+' '+hrefAttr+' '+attrs+' '+disabled+' class="btn '+cls+' '+extra+'">'+label+'</'+tag+'>';
}
function Badge(text, variant) {
  const cls = {gold:'badge-gold', navy:'badge-navy', soft:'badge-soft'}[variant||'soft'];
  return '<span class="badge '+cls+'">'+text+'</span>';
}
function Card(inner, opts) {
  opts = opts || {};
  const hover = opts.hover ? ' card-hover' : '';
  const extra = opts.class || '';
  const attrs = opts.attrs || '';
  return '<div '+attrs+' class="card'+hover+' '+extra+'">'+inner+'</div>';
}
function Input(label, id, opts) {
  opts = opts || {};
  const type = opts.type || 'text';
  const val = opts.value !== undefined ? 'value="'+esc(opts.value)+'"' : '';
  const ph = opts.placeholder ? 'placeholder="'+esc(opts.placeholder)+'"' : '';
  const req = opts.required ? 'required' : '';
  return '<div class="w-full">'+(label?'<label class="block text-sm font-semibold mb-1.5">'+label+'</label>':'')+
    '<input id="'+id+'" type="'+type+'" '+val+' '+ph+' '+req+' class="input-field" /></div>';
}
function Select(label, id, options, opts) {
  opts = opts || {};
  const optsHtml = options.map(o => '<option value="'+esc(o.value)+'" '+(opts.value===o.value?'selected':'')+'>'+esc(o.label)+'</option>').join('');
  return '<div class="w-full">'+(label?'<label class="block text-sm font-semibold mb-1.5">'+label+'</label>':'')+
    '<select id="'+id+'" class="input-field">'+optsHtml+'</select></div>';
}
function Textarea(label, id, opts) {
  opts = opts || {};
  return '<div class="w-full">'+(label?'<label class="block text-sm font-semibold mb-1.5">'+label+'</label>':'')+
    '<textarea id="'+id+'" rows="'+(opts.rows||4)+'" class="input-field resize-none">'+(opts.value?esc(opts.value):'')+'</textarea></div>';
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-navy text-white px-5 py-3 rounded-lg shadow-xl z-[100] fade-in text-sm font-medium';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function copyText(text) {
  navigator.clipboard && navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy failed'));
}
function downloadText(filename, text) {
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast('Downloaded '+filename);
}

}
function rerenderResourceGrid() {
  const cur = document.activeElement && document.activeElement.id;
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  render();
  window.scrollTo(0, scrollY);
  if (cur) { const el = document.getElementById(cur); if (el) el.focus(); }
}

let chatHistory = [];
function pageAIAssistant() {
  chatHistory = [];
  const samples = ['Solve x² − 5x + 6 = 0', 'Differentiate x³ + 2x', 'Find the integral of 2x', 'Simplify sin²θ + cos²θ'];
  return '<div class="container-wide max-w-3xl">'+
    '<div class="text-center mb-6">'+Badge('🧠 AI Mathematics Tutor','gold')+'<h1 class="text-3xl font-display font-bold my-3">AI Math Assistant</h1>'+
    '<p class="text-muted">Ask any Mathematics question — get Problem → Concept → Method → Steps → Answer.</p></div>'+
    '<div class="flex flex-wrap gap-2 justify-center mb-6">'+samples.map(s=>'<button onclick="askSample(\''+s.replace(/'/g,"\\'")+'\')" class="text-xs px-3 py-1.5 rounded-full surface font-medium">'+s+'</button>').join('')+'</div>'+
    Card('<div id="chatLog" class="space-y-4 max-h-[500px] overflow-y-auto mb-4 pr-1"><p class="text-muted text-sm text-center py-8">Ask a question to get started.</p></div>'+
      '<div class="flex gap-2"><input id="chatInput" onkeydown="if(event.key===\'Enter\') sendChat()" placeholder="Type your Mathematics question..." class="input-field flex-1"/>'+
      Btn('Ask',{variant:'primary', attrs:'onclick="sendChat()" id="chatBtn"'})+'</div>'
    )+
  '</div>';
}
function askSample(q) { document.getElementById('chatInput').value = q; sendChat(); }
function sendChat() {
  const inputEl = document.getElementById('chatInput');
  const q = inputEl.value.trim();
  if (!q) return;
  chatHistory.push({role:'user', text:q});
  renderChat();
  inputEl.value = '';
  const btn = document.getElementById('chatBtn'); btn.disabled = true;
  chatHistory.push({role:'thinking'});
  renderChat();
  setTimeout(()=>{
    chatHistory.pop();
    const s = aiSolve(q);
    chatHistory.push({role:'assistant', data:s});
    renderChat();
    btn.disabled = false;
  }, 800);
}
function renderChat() {
  const log = document.getElementById('chatLog');
  if (chatHistory.length===0) { log.innerHTML = '<p class="text-muted text-sm text-center py-8">Ask a question to get started.</p>'; return; }
  log.innerHTML = chatHistory.map(m => {
    if (m.role==='user') return '<div class="flex justify-end"><div class="max-w-[80%] px-4 py-2 rounded-xl rounded-tr-none text-white text-sm" style="background:var(--navy)">'+esc(m.text)+'</div></div>';
    if (m.role==='thinking') return '<div class="flex justify-start"><div class="px-4 py-2 rounded-xl rounded-tl-none surface text-sm text-muted">Thinking<span class="spin inline-block ml-1">⏳</span></div></div>';
    const s = m.data;
    return '<div class="flex justify-start"><div class="max-w-[90%] px-4 py-3 rounded-xl rounded-tl-none surface text-sm space-y-2">'+
      '<p><strong style="color:var(--navy)">Concept:</strong> '+s.concept+'</p>'+
      '<p><strong style="color:var(--navy)">Method:</strong> '+s.method+'</p>'+
      '<div><strong style="color:var(--navy)">Steps:</strong><ol class="list-decimal pl-5 mt-1 space-y-0.5">'+s.steps.map(st=>'<li>'+st+'</li>').join('')+'</ol></div>'+
      '<p class="pt-2 border-t border-app"><strong style="color:var(--navy)">Answer:</strong> '+s.answer+'</p>'+
    '</div></div>';
  }).join('');
  log.scrollTop = log.scrollHeight;
}

// ---------- SVG graph helper ----------
function svgFunctionPlot(fns, opts) {
  opts = opts || {};
  const w = opts.w||600, h = opts.h||360, pad = 30, scale = opts.scale||30;
  const cx = w/2, cy = h/2;
  const toX = x => cx + x*scale, toY = y => cy - y*scale;
  let grid = '';
  for (let gx = Math.ceil((-cx/scale)); gx <= Math.floor((cx/scale)); gx++) {
    grid += '<line x1="'+toX(gx)+'" y1="0" x2="'+toX(gx)+'" y2="'+h+'" stroke="currentColor" class="text-slate-200 dark:text-slate-800" stroke-width="'+(gx===0?0:1)+'"/>';
  }
  for (let gy = Math.ceil((-cy/scale)); gy <= Math.floor((cy/scale)); gy++) {
    grid += '<line x1="0" y1="'+toY(gy)+'" x2="'+w+'" y2="'+toY(gy)+'" stroke="currentColor" class="text-slate-200 dark:text-slate-800" stroke-width="'+(gy===0?0:1)+'"/>';
  }
  const paths = fns.map(fn => {
    let d = '', started = false;
    for (let sx=0; sx<=w; sx+=2) {
      const x = (sx-cx)/scale;
      const y = evalExpr(fn.expr, x);
      if (isFinite(y) && Math.abs(y) < (h/scale)*3) {
        const sy = toY(y);
        d += (started?'L':'M')+' '+sx+' '+sy+' ';
        started = true;
      } else started = false;
    }
    return '<path d="'+d+'" fill="none" stroke="'+fn.color+'" stroke-width="2.5" stroke-linecap="round"/>';
  }).join('');
  let extra = opts.extra || '';
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full h-auto rounded-lg surface">'+grid+
    '<line x1="0" y1="'+cy+'" x2="'+w+'" y2="'+cy+'" stroke="currentColor" class="text-slate-400" stroke-width="1.5"/>'+
    '<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+h+'" stroke="currentColor" class="text-slate-400" stroke-width="1.5"/>'+
    paths + extra + '</svg>';
}

let tfBase = 'x^2', tfA = 1, tfB = 1, tfH = 0, tfK = 0;
function pageTransformations() {

      '<div><label class="text-sm font-semibold">a (vertical stretch / reflect): <span id="tfALabel">'+tfA+'</span></label><input type="range" min="-3" max="3" step="0.1" value="'+tfA+'" oninput="tfA=+this.value; document.getElementById(\'tfALabel\').textContent=tfA; tfRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">b (horizontal stretch / compress): <span id="tfBLabel">'+tfB+'</span></label><input type="range" min="0.25" max="3" step="0.05" value="'+tfB+'" oninput="tfB=+this.value; document.getElementById(\'tfBLabel\').textContent=tfB; tfRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">h (shift right): <span id="tfHLabel">'+tfH+'</span></label><input type="range" min="-4" max="4" step="0.25" value="'+tfH+'" oninput="tfH=+this.value; document.getElementById(\'tfHLabel\').textContent=tfH; tfRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">k (shift up): <span id="tfKLabel">'+tfK+'</span></label><input type="range" min="-4" max="4" step="0.25" value="'+tfK+'" oninput="tfK=+this.value; document.getElementById(\'tfKLabel\').textContent=tfK; tfRedraw();" class="w-full range-navy"/></div>'+
      '<div id="tfOut" class="p-3 rounded-lg surface text-sm font-mono mt-2">'+tfOutHtml()+'</div>', {class:'h-fit'})+
    '<div class="lg:col-span-2" id="tfGraph">'+tfGraphHtml()+'</div>'+

}
function tfExpr() {
  const inner = tfBase.replace(/\bx\b/g, '('+tfB+'*(x-('+tfH+')))');

}
function tfOutHtml() {
  return '<p class="text-xs text-muted">Transformed function</p><p class="text-sm mt-1" style="color:var(--navy)">y = '+tfA+' · f( '+tfB+'(x − '+tfH+') ) + '+tfK+'</p>';
}
function tfGraphHtml() {
  return svgFunctionPlot([{expr: tfBase, color:'#94a3b8'}, {expr: tfExpr(), color:'#001f3f'}]);
}
function tfRedraw() {
  const g=document.getElementById('tfGraph'); if(g) g.innerHTML=tfGraphHtml();
  const o=document.getElementById('tfOut'); if(o) o.innerHTML=tfOutHtml();
}

let cgAx=1, cgAy=2, cgBx=4, cgBy=5;
function pageCoordGeometry() {

  return '<div class="container-wide max-w-5xl">'+vizHeader('📍','Coordinate Geometry','Enter two points to explore distance, midpoint, slope and the equation of the line through them.')+
  '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">'+
    Card('<h3 class="font-bold text-sm mb-2">Point A 🔴</h3>'+ptInputs(cgAx,cgAy,'cgAx=parseFloat(this.value)||0; cgRedraw();','cgAy=parseFloat(this.value)||0; cgRedraw();')+
      '<h3 class="font-bold text-sm mb-2 mt-4">Point B 🟢</h3>'+ptInputs(cgBx,cgBy,'cgBx=parseFloat(this.value)||0; cgRedraw();','cgBy=parseFloat(this.value)||0; cgRedraw();')+
      '<div id="cgOut" class="p-3 rounded-lg surface text-sm space-y-1 mt-4">'+cgOutHtml()+'</div>', {class:'h-fit'})+
    '<div class="lg:col-span-2" id="cgGraph">'+cgGraphHtml()+'</div>'+
  '</div></div>';
}
function cgMetrics() {
  const dx=cgBx-cgAx, dy=cgBy-cgAy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const mid={x:(cgAx+cgBx)/2, y:(cgAy+cgBy)/2};
  const vertical = Math.abs(dx)<1e-9;
  const m = vertical ? null : dy/dx;
  const c = vertical ? null : cgAy - m*cgAx;
  return {dist,mid,vertical,m,c};
}
function cgGraphHtml() {
  const {mid,vertical,m,c}=cgMetrics();
  const w=600,h=360,scale=30,cx=w/2,cy=h/2;
  const toX=x=>cx+x*scale, toY=y=>cy-y*scale;
  let extra='';
  if (!vertical) {
    const x1=-(cx/scale)-1, x2=(cx/scale)+1;
    extra += '<line x1="'+toX(x1)+'" y1="'+toY(m*x1+c)+'" x2="'+toX(x2)+'" y2="'+toY(m*x2+c)+'" stroke="#001f3f" stroke-width="2.5"/>';
  } else {
    extra += '<line x1="'+toX(cgAx)+'" y1="0" x2="'+toX(cgAx)+'" y2="'+h+'" stroke="#001f3f" stroke-width="2.5"/>';
  }
  extra += '<circle cx="'+toX(cgAx)+'" cy="'+toY(cgAy)+'" r="6" fill="#dc2626"/><circle cx="'+toX(cgBx)+'" cy="'+toY(cgBy)+'" r="6" fill="#059669"/>'+
    '<circle cx="'+toX(mid.x)+'" cy="'+toY(mid.y)+'" r="5" fill="#ffc107" stroke="#001f3f" stroke-width="1.5"/>'+
    '<text x="'+toX(cgAx)+'" y="'+(toY(cgAy)-12)+'" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">A</text>'+
    '<text x="'+toX(cgBx)+'" y="'+(toY(cgBy)-12)+'" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">B</text>';
  return svgFunctionPlot([], {extra:extra});
}
function cgOutHtml() {
  const {dist,mid,vertical,m,c}=cgMetrics();
  return '<div class="flex justify-between"><span>Distance AB</span><strong style="color:var(--navy)">'+round(dist,2)+'</strong></div>'+
    '<div class="flex justify-between"><span>Midpoint</span><strong>('+round(mid.x,2)+', '+round(mid.y,2)+')</strong></div>'+
    (vertical ? '<div class="flex justify-between"><span>Line</span><strong>vertical: x = '+cgAx+'</strong></div>'
      : '<div class="flex justify-between"><span>Slope m</span><strong>'+round(m,3)+'</strong></div>'+
        '<div class="flex justify-between"><span>Equation</span><strong>y = '+round(m,2)+'x + '+round(c,2)+'</strong></div>');
}

      '<div class="flex gap-2 pt-2"><button onclick="lmToggleAnim()" id="lmAnimBtn" class="btn btn-primary flex-1 justify-center">'+ICONS.play+' Animate</button><button onclick="lmStop(); lmStep=10; lmRedraw();" class="btn btn-outline">Reset</button></div>'+

    '<div class="lg:col-span-2 space-y-4"><div id="lmGraph">'+lmGraphHtml()+'</div><div id="lmTable">'+lmTableHtml()+'</div></div>'+
  '</div></div>';
}
function lmCur(){ return LIM_FNS[lmSel]; }
function lmDist(){ return 2*Math.pow(0.87, lmStep-1); }
function lmLimitVal(){ const c=lmCur().c; return evalExpr(lmCur().expr, c+1e-4); }
function lmGraphHtml(){
  const f=lmCur(); const d=lmDist(); const L=lmLimitVal();
  const w=600,h=360,scale=30,cx=w/2,cy=h/2;

  const yl=evalExpr(f.expr,xl), yr=evalExpr(f.expr,xr);

  if (isFinite(yr)) extra += '<circle cx="'+toX(xr)+'" cy="'+toY(yr)+'" r="6" fill="#059669"/>';
  return svgFunctionPlot([{expr:f.expr, color:'#2563eb'}], {extra:extra});

function lmTableHtml(){
  const f=lmCur(); let rows='';

}
function lmOutHtml(){
  const f=lmCur(); const d=lmDist();
  return '<div class="flex justify-between"><span>x → from left</span><strong>'+round(f.c-d,5)+'</strong></div>'+
    '<div class="flex justify-between"><span>f(x) left</span><strong>'+round(evalExpr(f.expr,f.c-d),5)+'</strong></div>'+
    '<div class="flex justify-between"><span>x → from right</span><strong>'+round(f.c+d,5)+'</strong></div>'+
    '<div class="flex justify-between"><span>f(x) right</span><strong>'+round(evalExpr(f.expr,f.c+d),5)+'</strong></div>'+
    '<div class="flex justify-between pt-2 border-t border-app mt-2"><span>Limit</span><strong style="color:var(--navy)">'+round(lmLimitVal(),5)+'</strong></div>';
}
function lmRedraw(){ const m={lmGraph:lmGraphHtml(), lmTable:lmTableHtml(), lmOut:lmOutHtml()}; for(const k in m){const e=document.getElementById(k); if(e) e.innerHTML=m[k];} const l=document.getElementById('lmStepLabel'); if(l) l.textContent=lmStep; }
function lmStop(){ if(lmTimer){ clearInterval(lmTimer); lmTimer=null; } const b=document.getElementById('lmAnimBtn'); if(b) b.innerHTML=ICONS.play+' Animate'; }
function lmToggleAnim(){
  if (lmTimer){ lmStop(); return; }
  lmStep = 1; lmRedraw();
  lmTimer = setInterval(()=>{ lmStep++; if(lmStep>=40){ lmStep=40; lmStop(); } lmRedraw(); }, 160);
  registerCleanup(lmStop);

}

let intgFn='x^2', intgA=0, intgB=3, intgN=12, intgMethod='left';
function pageIntegration() {
  return '<div class="container-wide max-w-5xl">'+vizHeader('∫','Integration — Area Under the Curve','Approximate definite integrals with Riemann sums and trapezoids, and compare with the exact area.')+
  '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">'+
    Card('<label class="text-sm font-semibold">Function f(x)</label><select onchange="intgFn=this.value; intgRedraw();" class="input-field mt-1 mb-4 font-mono">'+
      ['x^2','sin(x)+2','sqrt(x)','x^3-2*x'].map(f=>'<option '+(f===intgFn?'selected':'')+'>'+f+'</option>').join('')+'</select>'+
      '<div><label class="text-sm font-semibold">a (lower limit): <span id="intgALabel">'+intgA+'</span></label><input type="range" min="-4" max="4" step="0.5" value="'+intgA+'" oninput="intgA=+this.value; document.getElementById(\'intgALabel\').textContent=intgA; intgRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">b (upper limit): <span id="intgBLabel">'+intgB+'</span></label><input type="range" min="-4" max="4" step="0.5" value="'+intgB+'" oninput="intgB=+this.value; document.getElementById(\'intgBLabel\').textContent=intgB; intgRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">n (slices): <span id="intgNLabel">'+intgN+'</span></label><input type="range" min="2" max="60" value="'+intgN+'" oninput="intgN=+this.value; document.getElementById(\'intgNLabel\').textContent=intgN; intgRedraw();" class="w-full range-navy"/></div>'+
      '<label class="text-sm font-semibold">Method</label><select onchange="intgMethod=this.value; intgRedraw();" class="input-field mt-1">'+
        ['left','midpoint','trapezoid'].map(m=>'<option value="'+m+'" '+(m===intgMethod?'selected':'')+'>'+m.charAt(0).toUpperCase()+m.slice(1)+'</option>').join('')+'</select>'+
      '<div id="intgOut" class="p-3 rounded-lg surface text-sm space-y-1 mt-4">'+intgOutHtml()+'</div>', {class:'h-fit'})+
    '<div class="lg:col-span-2" id="intgGraph">'+intgGraphHtml()+'</div>'+
  '</div></div>';
}
function intgRange(){ return intgA<=intgB ? [intgA,intgB] : [intgB,intgA]; }
function intgExact(){
  const rg=intgRange(); const n=1000; const h=(rg[1]-rg[0])/n; let s=0;
  for(let i=0;i<n;i++){ s += evalExpr(intgFn, rg[0]+i*h+h/2)*h; }
  return s;
}
function intgApprox(){
  const rg=intgRange(); const n=intgN; const wdt=(rg[1]-rg[0])/n; let s=0;
  for(let i=0;i<n;i++){
    if(intgMethod==='left') s += evalExpr(intgFn, rg[0]+i*wdt)*wdt;
    else if(intgMethod==='midpoint') s += evalExpr(intgFn, rg[0]+i*wdt+wdt/2)*wdt;
    else s += (evalExpr(intgFn,rg[0]+i*wdt)+evalExpr(intgFn,rg[0]+(i+1)*wdt))/2*wdt;
  }
  return s;
}
function intgGraphHtml(){
  const rg=intgRange(); const n=intgN; const wdt=(rg[1]-rg[0])/n;
  const wpx=600,hpx=360,scale=30,cx=wpx/2,cy=hpx/2;
  const toX=x=>cx+x*scale, toY=y=>cy-y*scale;
  let bars='';
  if (rg[1]>rg[0]) {
    for(let i=0;i<n;i++){
      const x0=rg[0]+i*wdt;
      let y0,y1;
      if(intgMethod==='left'){ y0=evalExpr(intgFn,x0); y1=y0; }
      else if(intgMethod==='midpoint'){ y0=evalExpr(intgFn,x0+wdt/2); y1=y0; }
      else { y0=evalExpr(intgFn,x0); y1=evalExpr(intgFn,x0+wdt); }
      if(!isFinite(y0)||!isFinite(y1)) continue;
      if(intgMethod==='trapezoid'){
        bars += '<polygon points="'+toX(x0)+','+toY(Math.max(0,y0))+' '+toX(x0+wdt)+','+toY(Math.max(0,y1))+' '+toX(x0+wdt)+','+toY(Math.min(0,y1))+' '+toX(x0)+','+toY(Math.min(0,y0))+'" fill="#ffc107" fill-opacity="0.55" stroke="#001f3f" stroke-width="1"/>';
      } else {
        const top=Math.max(0,y0,y1), bot=Math.min(0,y0,y1);
        bars += '<rect x="'+toX(x0)+'" y="'+toY(top)+'" width="'+Math.max(wdt*scale-0.5,0.5)+'" height="'+Math.max(toY(bot)-toY(top),0)+'" fill="#ffc107" fill-opacity="0.55" stroke="#001f3f" stroke-width="0.75"/>';
      }
    }
  }
  return svgFunctionPlot([{expr:intgFn, color:'#001f3f'}], {extra:bars});
}
function intgOutHtml(){
  const ap=intgApprox(), ex=intgExact();
  return '<div class="flex justify-between"><span>Approximate (∫)</span><strong style="color:var(--navy)">'+round(ap,4)+'</strong></div>'+
    '<div class="flex justify-between"><span>Exact (Simpson)</span><strong>'+round(ex,4)+'</strong></div>'+
    '<div class="flex justify-between"><span>Error</span><strong style="color:#dc2626">'+round(Math.abs(ap-ex),5)+'</strong></div>'+
    '<p class="text-xs text-muted pt-2 border-t border-app mt-2">Increase n to watch the approximation converge.</p>';
}
function intgRedraw(){ const g=document.getElementById('intgGraph'); if(g) g.innerHTML=intgGraphHtml(); const o=document.getElementById('intgOut'); if(o) o.innerHTML=intgOutHtml(); }

function vecGraphHtml(){
  const sx=vecA.x+vecB.x, sy=vecA.y+vecB.y;
  const w=600,h=360,scale=30,cx=w/2,cy=h/2;
  const toX=x=>cx+x*scale, toY=y=>cy-y*scale;
  const arrow=(x1,y1,x2,y2,color)=>{
    const X1=toX(x1),Y1=toY(y1),X2=toX(x2),Y2=toY(y2);
    const ang=Math.atan2(Y2-Y1,X2-X1), ah=10;
    return '<line x1="'+X1+'" y1="'+Y1+'" x2="'+X2+'" y2="'+Y2+'" stroke="'+color+'" stroke-width="2.5"/>'+
      '<polygon points="'+X2+','+Y2+' '+(X2-ah*Math.cos(ang-0.42))+','+(Y2-ah*Math.sin(ang-0.42))+' '+(X2-ah*Math.cos(ang+0.42))+','+(Y2-ah*Math.sin(ang+0.42))+'" fill="'+color+'"/>';
  };
  let extra = arrow(0,0,vecA.x,vecA.y,'#001f3f') + arrow(0,0,vecB.x,vecB.y,'#059669') + arrow(0,0,sx,sy,'#dc2626');
  extra += '<line x1="'+toX(vecA.x)+'" y1="'+toY(vecA.y)+'" x2="'+toX(sx)+'" y2="'+toY(sy)+'" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>'+
    '<line x1="'+toX(vecB.x)+'" y1="'+toY(vecB.y)+'" x2="'+toX(sx)+'" y2="'+toY(sy)+'" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>';
  return svgFunctionPlot([], {extra:extra});
}
function vecOutHtml(){
  const mag=a=>Math.sqrt(a.x*a.x+a.y*a.y);
  const dir=a=>Math.atan2(a.y,a.x)*180/Math.PI;
  const dot=vecA.x*vecB.x+vecA.y*vecB.y;
  const m1=mag(vecA), m2=mag(vecB);
  const ang=(m1>0&&m2>0)?Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2))))*180/Math.PI:0;
  return '<div class="flex justify-between"><span>|a|</span><strong>'+round(m1,2)+'</strong></div>'+
    '<div class="flex justify-between"><span>|b|</span><strong>'+round(m2,2)+'</strong></div>'+
    '<div class="flex justify-between"><span>a + b (red)</span><strong style="color:var(--navy)">('+(vecA.x+vecB.x)+', '+(vecA.y+vecB.y)+')</strong></div>'+
    '<div class="flex justify-between"><span>Direction of a</span><strong>'+round(dir(vecA),1)+'°</strong></div>'+
    '<div class="flex justify-between"><span>a · b</span><strong>'+round(dot,2)+'</strong></div>'+
    '<div class="flex justify-between"><span>Angle between</span><strong>'+round(ang,1)+'°</strong></div>';
}
function vecRedraw(){ const g=document.getElementById('vecGraph'); if(g) g.innerHTML=vecGraphHtml(); const o=document.getElementById('vecOut'); if(o) o.innerHTML=vecOutHtml(); }

function mtxApplyRot(deg){
  const r=toRad(parseFloat(deg));

function mtxGraphHtml(){

  const w=420,h=380,ox=50,oy=330,sc=120;
  const X=x=>ox+x*sc, Y=y=>oy-y*sc;

  '</svg>';
}
function mtxOutHtml(){
  const det=mtx[0]*mtx[3]-mtx[1]*mtx[2];
  return '<div class="flex justify-between"><span>Matrix</span><strong class="font-mono">[[ '+mtx.join(', ')+' ]]</strong></div>'+

      '<div><label class="text-sm font-semibold">Velocity: <span id="pmVLabel">'+pmVelocity+'</span> m/s</label><input type="range" min="10" max="60" value="'+pmVelocity+'" oninput="pmVelocity=+this.value; pmVLabel.textContent=this.value; pmReset();" class="w-full range-navy" id="pmVSlider"/></div>'+
      '<div><label class="text-sm font-semibold">Angle: <span id="pmALabel">'+pmAngle+'</span>°</label><input type="range" min="5" max="85" value="'+pmAngle+'" oninput="pmAngle=+this.value; pmALabel.textContent=this.value; pmReset();" class="w-full range-navy" id="pmASlider"/></div>'+
      '<div class="flex gap-2 pt-2">'+Btn('Start',{variant:'primary', class:'flex-1 justify-center', attrs:'onclick="pmToggle()" id="pmBtn"'})+Btn('Reset',{variant:'outline', attrs:'onclick="pmReset()"'})+'</div>'+
      '<div id="pmOut" class="p-3 rounded-lg surface text-sm space-y-1 mt-2">'+pmOutHtml()+'</div>',
      pmSvgHtml(),
      "Understand how launch angle and speed determine a projectile's range, height, and flight time."
    )+'</div>';
}
function pmCalc() {
  const rad = toRad(pmAngle), g=9.8;
  const vx = pmVelocity*Math.cos(rad), vy = pmVelocity*Math.sin(rad);
  const flight = 2*vy/g, range = (pmVelocity*pmVelocity*Math.sin(2*rad))/g, maxH = (vy*vy)/(2*g);
  return {vx,vy,flight,range,maxH};
}
function pmSvgHtml() {
  const {vx,vy,flight,range,maxH} = pmCalc();
  const w=600,h=340,pad=30;
  const scale = Math.min((w-pad*2)/Math.max(range,1), (h-pad*2)/Math.max(maxH,1), 15);
  const toX = x=>pad+x*scale, toY = y=>h-pad-y*scale;
  const x = vx*pmT, y = Math.max(0, vy*pmT-4.9*pmT*pmT);
  let traj='';
  for (let i=0;i<=50;i++){ const ti=flight*i/50; const xi=vx*ti; const yi=Math.max(0,vy*ti-4.9*ti*ti); traj += (i===0?'M':'L')+toX(xi)+' '+toY(yi)+' '; }
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full h-auto surface rounded-lg">'+
    '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="currentColor" class="text-slate-400" stroke-width="2"/>'+
    '<path d="'+traj+'" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>'+
    '<circle cx="'+toX(x)+'" cy="'+toY(y)+'" r="8" fill="var(--navy)"/>'+
    '<circle cx="'+toX(0)+'" cy="'+toY(0)+'" r="4" fill="#dc2626"/>'+
  '</svg>';
}
function pmOutHtml() { const {flight,range,maxH} = pmCalc(); return '<div class="flex justify-between"><span>Range</span><strong>'+round(range,1)+' m</strong></div><div class="flex justify-between"><span>Max Height</span><strong>'+round(maxH,1)+' m</strong></div><div class="flex justify-between"><span>Flight Time</span><strong>'+round(flight,2)+' s</strong></div><div class="flex justify-between"><span>Current t</span><strong style="color:var(--navy)">'+round(pmT,2)+' s</strong></div>'; }
function pmToggle() {
  pmRunning = !pmRunning;
  document.getElementById('pmBtn').textContent = pmRunning ? 'Pause' : 'Start';
  if (pmRunning) { pmLast=null; pmRaf = requestAnimationFrame(pmStep); registerCleanup(()=>{ if(pmRaf) cancelAnimationFrame(pmRaf); }); }
  else if (pmRaf) cancelAnimationFrame(pmRaf);
}
function pmStep(ts) {
  if (pmLast===null) pmLast=ts;
  const dt = (ts-pmLast)/1000; pmLast=ts;
  const {flight} = pmCalc();
  pmT += dt;
  if (pmT >= flight) { pmT = flight; pmRunning = false; document.getElementById('pmBtn').textContent = 'Start'; }
  document.getElementById('simCanvas').innerHTML = pmSvgHtml();
  document.getElementById('pmOut').innerHTML = pmOutHtml();
  if (pmRunning) pmRaf = requestAnimationFrame(pmStep);
}
function pmReset() { pmT=0; pmRunning=false; if(pmRaf) cancelAnimationFrame(pmRaf); const btn=document.getElementById('pmBtn'); if(btn) btn.textContent='Start'; const c=document.getElementById('simCanvas'); if(c) c.innerHTML=pmSvgHtml(); const o=document.getElementById('pmOut'); if(o) o.innerHTML=pmOutHtml(); }

function ctFlip() { ctLast = Math.random()<0.5?'H':'T'; if(ctLast==='H') ctHeads++; else ctTails++; document.getElementById('ctCanvasInner').innerHTML=ctCanvasHtml(); document.getElementById('ctOut').innerHTML=ctOutHtml(); }

let ciPrincipal=10000, ciRate=8, ciYears=10, ciFreq=1;
function pageCompoundInterest() {
  return '<div class="container-wide max-w-6xl">'+simHeader('💰','Compound Interest','Compare simple vs. compound interest growth over time.')+
    simLayout(
      '<div><label class="text-sm font-semibold">Principal: रू<span id="ciPLabel">'+ciPrincipal.toLocaleString()+'</span></label><input type="range" min="1000" max="100000" step="1000" value="'+ciPrincipal+'" oninput="ciPrincipal=+this.value; ciPLabel.textContent=(+this.value).toLocaleString(); ciRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">Rate: <span id="ciRLabel">'+ciRate+'</span>%</label><input type="range" min="1" max="20" step="0.5" value="'+ciRate+'" oninput="ciRate=+this.value; ciRLabel.textContent=this.value; ciRedraw();" class="w-full range-navy"/></div>'+
      '<div><label class="text-sm font-semibold">Years: <span id="ciYLabel">'+ciYears+'</span></label><input type="range" min="1" max="30" value="'+ciYears+'" oninput="ciYears=+this.value; ciYLabel.textContent=this.value; ciRedraw();" class="w-full range-navy"/></div>'+
      '<select onchange="ciFreq=+this.value; ciRedraw();" class="input-field"><option value="1">Annually</option><option value="4">Quarterly</option><option value="12">Monthly</option></select>'+
      '<div id="ciOut" class="p-3 rounded-lg surface text-sm space-y-1 mt-2">'+ciOutHtml()+'</div>',
      '<div id="ciCanvasInner">'+ciSvgHtml()+'</div>',
      'Understand how compounding frequency and time cause exponential growth to outpace linear growth.'
    )+'</div>';
}
function ciData() {
  const pts=[]; for (let y=0;y<=ciYears;y++){ const c=ciPrincipal*Math.pow(1+ciRate/100/ciFreq, ciFreq*y); const s=ciPrincipal*(1+(ciRate/100)*y); pts.push({y,c,s}); } return pts;
}
function ciSvgHtml() {
  const data = ciData(); const w=600,h=320,pad=45;
  const maxV = Math.max(data[data.length-1].c, data[data.length-1].s);
  const toX = yv => pad+(yv/ciYears)*(w-pad*2), toY = v => h-pad-(v/maxV)*(h-pad*2);
  const cPath = data.map((d,i)=>(i===0?'M':'L')+toX(d.y)+' '+toY(d.c)).join(' ');
  const sPath = data.map((d,i)=>(i===0?'M':'L')+toX(d.y)+' '+toY(d.s)).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full h-auto surface rounded-lg">'+
    '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="currentColor" class="text-slate-400"/>'+
    '<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="currentColor" class="text-slate-400"/>'+
    '<path d="'+sPath+'" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>'+
    '<path d="'+cPath+'" fill="none" stroke="var(--navy)" stroke-width="2.5"/>'+
  '</svg>';
}
function ciOutHtml() { const data=ciData(); const last=data[data.length-1]; return '<div class="flex justify-between"><span>Compound</span><strong style="color:var(--navy)">रू'+Math.round(last.c).toLocaleString()+'</strong></div><div class="flex justify-between"><span>Simple</span><strong>रू'+Math.round(last.s).toLocaleString()+'</strong></div><div class="flex justify-between"><span>Difference</span><strong style="color:#059669">रू'+Math.round(last.c-last.s).toLocaleString()+'</strong></div>'; }
function ciRedraw() { document.getElementById('ciCanvasInner').innerHTML = ciSvgHtml(); document.getElementById('ciOut').innerHTML = ciOutHtml(); }

function navigate(path) { window.location.hash = '#'+path; }

function resolveRoute(hash) {
  const path = (hash || '#/').replace(/^#/, '') || '/';
  const parts = path.split('/').filter(Boolean); // e.g. ['ai-toolkit','lesson-plan']

  if (path === '/') return {fn: pageHome};
  if (path === '/about') return {fn: pageAbout};
  if (path === '/contact') return {fn: pageContact};
  if (path === '/courses') return {fn: pageCourses};
  if (parts[0]==='courses' && parts[1]) return {fn: ()=>pageCourses(parts[1])};
  if (path === '/resources') return {fn: pageResources};
  if (path === '/login') return {fn: pageLogin};
  if (path === '/register') return {fn: pageRegister};
  if (path === '/teacher-dashboard') return {fn: pageTeacherDashboard};
  if (path === '/student-dashboard') return {fn: pageStudentDashboard};
  if (path === '/admin-dashboard') return {fn: pageAdminDashboard};
  if (path === '/ai-assistant') return {fn: pageAIAssistant};

  if (path === '/ai-toolkit') return {fn: pageAIToolkitHub};
  if (parts[0]==='ai-toolkit' && parts[1]) {
    const tool = parts[1];
    if (tool==='lesson-plan') return {fn: pageLessonPlan};
    if (tool==='worksheet') return {fn: pageWorksheet};
    if (tool==='question-paper') return {fn: pageQuestionPaper};
    if (tool==='mcq') return {fn: pageMCQ};
    if (GENERIC_TOOL_META[tool]) return {fn: ()=>pageGenericTool(tool)};
    return {fn: pageNotFound};
  }

  if (path === '/visualization-lab') return {fn: pageVizHub};
  if (parts[0]==='visualization-lab' && parts[1]) {
    const mod = parts[1];
    if (mod==='function-grapher') return {fn: pageFunctionGrapher};
    if (mod==='trigonometry') return {fn: pageTrig};
    if (mod==='derivatives') return {fn: pageDerivatives};
    if (mod==='statistics') return {fn: pageStatistics};
    if (mod==='transformations') return {fn: pageTransformations};
    if (mod==='coordinate-geometry') return {fn: pageCoordGeometry};
    if (mod==='limits') return {fn: pageLimits};
    if (mod==='integration') return {fn: pageIntegration};
    if (mod==='vectors') return {fn: pageVectors};
    if (mod==='matrix') return {fn: pageMatrix};
    return {fn: pageNotFound};
  }

  if (path === '/simulation-lab') return {fn: pageSimHub};
  if (parts[0]==='simulation-lab' && parts[1]) {
    const sim = parts[1];
    if (sim==='projectile-motion') return {fn: pagePMotion};
    if (sim==='coin-toss') return {fn: pageCoinToss};
    if (sim==='dice-experiment') return {fn: pageDice};
    if (sim==='compound-interest') return {fn: pageCompoundInterest};
    return {fn: pageNotFound};
  }

  if (path === '/quizzes') return {fn: pageQuizList};
  if (parts[0]==='quizzes' && parts[1]) return {fn: ()=>pageQuizTake(parts[1])};

  return {fn: pageNotFound};
}

let currentRoutePath = '/';
function render() {
  const hash = window.location.hash || '#/';
  currentRoutePath = hash.replace(/^#/, '') || '/';
  const route = resolveRoute(hash);
  const content = route.fn();
  document.getElementById('app').innerHTML = Shell(currentRoutePath, content);
}

window.addEventListener('hashchange', () => {
  runCleanup();
  render();
  window.scrollTo(0, 0);
});

// ============================================================
// INIT
// ============================================================
applyTheme();
if (!window.location.hash) window.location.hash = '#/';
render();
</script>
