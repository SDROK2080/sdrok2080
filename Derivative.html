<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derivatives – Interactive Simulation | KMC-HSSD</title>
<style>
:root{color-scheme:dark;--bg:#0f1220;--card:#181c30;--line:#2a3050;--tx:#e8e9f2;--mut:#9aa0bd;--gold:#f5b942;--org:#ff7a3d;--grn:#4cd6a0;--red:#ff5d6c;--blu:#6aa8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
h1{margin:0;font-size:1.45rem;color:var(--gold)}
.sub{color:var(--mut);font-size:.85rem}
h2{color:var(--gold);font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
button,select{background:#232844;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem;cursor:pointer}
button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1a1405;font-weight:700;border-color:var(--gold)}
canvas{width:100%;display:block;background:#0b0e1a;border:1px solid var(--line);border-radius:10px;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
.ctl{flex:1 1 240px}
.ctl label{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mut)}
.ctl b{color:var(--org)}
input[type=range]{width:100%;accent-color:var(--org)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.n{background:#0b0e1a;border:1px solid var(--line);border-radius:8px;padding:8px}
.n small{display:block;color:var(--mut);font-size:.74rem}
.n span{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.sec{color:var(--org)}.tan{color:var(--grn)}
.formula{background:#0b0e1a;border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;font-family:Georgia,serif;font-size:1.05rem;margin:8px 0;overflow-x:auto}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--grn);background:#12382c}.opt.bad{border-color:var(--red);background:#40161c}
.fb{font-size:.88rem;color:var(--mut);margin:4px 0 10px}
.legend{font-size:.8rem;color:var(--mut);margin-top:6px}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:10px 0 20px}
</style></head><body><div class="wrap">
<header><div><h1 id="t_title"></h1><div class="sub" id="t_sub"></div></div>
<button id="lang">नेपाली</button></header>

<div class="card"><h2 id="t_exp_h"></h2><div id="t_exp"></div>
<div class="formula">f′(a) = lim<sub>h→0</sub> [ f(a+h) − f(a) ] / h</div></div>

<div class="card"><h2 id="t_sim_h"></h2>
<div class="row"><select id="fn"><option value="sq">f(x) = x²</option><option value="cu">f(x) = x³</option><option value="sn">f(x) = sin x</option><option value="ab">f(x) = |x|</option></select>
<button id="dir"></button><button class="pri" id="anim"></button></div>
<canvas id="c1" width="900" height="420"></canvas>
<div class="legend" id="t_leg"></div>
<div class="row"><div class="ctl"><label><span id="t_a"></span><b id="av"></b></label><input type="range" id="a" min="-2.5" max="2.5" step="0.01" value="1"></div>
<div class="ctl"><label><span id="t_h"></span><b id="hv"></b></label><input type="range" id="h" min="0" max="100" step="1" value="80"></div></div>
<div class="nums" id="nums"></div>
<h2 style="margin-top:14px" id="t_dg"></h2>
<canvas id="c2" width="900" height="260"></canvas></div>

<div class="card"><h2 id="t_try_h"></h2><ul id="t_try"></ul></div>
<div class="card"><h2 id="t_q_h"></h2><div id="quiz"></div><div id="score" style="color:var(--gold);font-weight:700"></div></div>
<footer>Kapilvastu Multiple Campus (KMC) • HSS Department • UCDL Academy • SDROK • Tribhuvan University</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const sg=x=>x>0?1:x<0?-1:0;
const F={
 sq:{f:x=>x*x,d:x=>2*x,y:[-1,8],y2:[-6,6]},
 cu:{f:x=>x*x*x,d:x=>3*x*x,y:[-16,16],y2:[-2,20]},
 sn:{f:Math.sin,d:Math.cos,y:[-2,2],y2:[-1.6,1.6]},
 ab:{f:Math.abs,d:sg,y:[-1,4],y2:[-1.6,1.6]}};
const T={
en:{title:"Derivatives – Interactive Simulation",sub:"Functions, Limit, Continuity & Derivatives • Calculus • TU BA/BSc/BEd/Engineering",
exp_h:"Idea in a nutshell",
exp:"<p>The derivative tells us <b>how fast a function changes at one point</b>. Take two points on the curve, x = a and x = a+h. The line through them is a <b class='sec'>secant</b> and its slope is the average rate of change. As h shrinks toward 0, the secant turns into the <b class='tan'>tangent</b>; its slope is the derivative f′(a).</p><p>A derivative exists only if the left-hand and right-hand slopes agree. A function that is differentiable at a point is always continuous there, but not the other way round (e.g. |x| at 0).</p>",
sim_h:"Simulation: secant → tangent",leg:"Orange = secant through (a, f(a)) and (a+h, f(a+h)). Green = tangent. Drag sliders or press Animate.",
a:"Point a",h:"Step size |h|",dg:"Derivative graph f′(x): orange dot = secant slope, green dot = true f′(a)",
dirR:"Direction: h > 0 (right)",dirL:"Direction: h < 0 (left)",anim:"▶ Animate h → 0",stop:"■ Stop",
fa:"f(a)",fah:"f(a+h)",dy:"Δy = f(a+h) − f(a)",sl:"Secant slope Δy/h",ex:"f′(a) (exact)",er:"Gap |secant − f′(a)|",dne:"does not exist",
try_h:"Try this",
try_:["Choose f(x)=x², set a=1. Move h toward 0 and watch the secant slope approach 2. Why is f′(1)=2a=2?","Keep h very small and slide a from −2.5 to 2.5. Compare the orange dot with the curve f′(x)=2x. What shape does f′ have?","Choose sin x. At which values of a is the tangent flat (slope 0)? What is f′ there?","Choose |x|, set a=0. Switch direction left/right. What are the two slopes? Is the derivative defined?"],
q_h:"Quick Quiz (3 questions)",
Q:[{q:"If f(x)=x², what is f′(3)?",o:["3","6","9","2"],c:1,e:"f′(x)=2x, so f′(3)=6. Check by letting a=3 and h→0 in the simulation."},
{q:"Geometrically, f′(a) is …",o:["the value f(a)","the slope of the chord for a fixed h=1","the slope of the tangent line at x=a","the area under the curve"],c:2,e:"The tangent is the limiting position of the secant as h→0."},
{q:"Why is f(x)=|x| not differentiable at x=0?",o:["Left slope = −1 but right slope = +1, so the limit does not exist","It is not continuous at 0","Its derivative is 0 at 0","It is not defined at 0"],c:0,e:"|x| is continuous at 0, but the one-sided limits of the difference quotient differ, so no single tangent exists."}],
ok:"✔ Correct. ",no:"✘ Not quite. ",sc:"Score: "},
ne:{title:"अवकलन (Derivatives) – अन्तरक्रियात्मक सिमुलेसन",sub:"फलन, सीमा, निरन्तरता र अवकलन • क्याल्कुलस • TU BA/BSc/BEd/इन्जिनियरिङ",
exp_h:"मुख्य विचार",
exp:"<p>अवकलनले <b>कुनै एक बिन्दुमा फलन कति छिटो परिवर्तन हुन्छ</b> भन्ने देखाउँछ। वक्रमा x = a र x = a+h दुई बिन्दु लिनुहोस्। यी दुईलाई जोड्ने रेखा <b class='sec'>छेदक रेखा (secant)</b> हो, जसको ढाल औसत परिवर्तन दर हो। h क्रमशः 0 तिर जाँदा छेदक रेखा <b class='tan'>स्पर्श रेखा (tangent)</b> बन्छ; यसको ढाल नै अवकल f′(a) हो।</p><p>बायाँ र दायाँ ढाल बराबर भएमा मात्र अवकल अस्तित्वमा हुन्छ। कुनै बिन्दुमा अवकलनीय फलन त्यहाँ निरन्तर हुन्छ, तर उल्टो सधैं सत्य हुँदैन (जस्तै 0 मा |x|)।</p>",
sim_h:"सिमुलेसन: छेदक → स्पर्श रेखा",leg:"सुन्तला = (a, f(a)) र (a+h, f(a+h)) बाट जाने छेदक रेखा। हरियो = स्पर्श रेखा। स्लाइडर तान्नुहोस् वा Animate थिच्नुहोस्।",
a:"बिन्दु a",h:"पदान्तर |h|",dg:"अवकल ग्राफ f′(x): सुन्तला थोप्लो = छेदकको ढाल, हरियो थोप्लो = वास्तविक f′(a)",
dirR:"दिशा: h > 0 (दायाँ)",dirL:"दिशा: h < 0 (बायाँ)",anim:"▶ h → 0 एनिमेट",stop:"■ रोक्नुहोस्",
fa:"f(a)",fah:"f(a+h)",dy:"Δy = f(a+h) − f(a)",sl:"छेदकको ढाल Δy/h",ex:"f′(a) (यथार्थ)",er:"फरक |छेदक − f′(a)|",dne:"अस्तित्वमा छैन",
try_h:"यो गरेर हेर्नुहोस्",
try_:["f(x)=x² छानी a=1 राख्नुहोस्। h लाई 0 तिर सार्दा छेदकको ढाल 2 तिर पुग्छ। f′(1)=2a=2 किन हो?","h धेरै सानो राखी a लाई −2.5 देखि 2.5 सम्म सार्नुहोस्। सुन्तला थोप्लोलाई f′(x)=2x सँग तुलना गर्नुहोस्। f′ को आकार कस्तो छ?","sin x छान्नुहोस्। a का कुन मानमा स्पर्श रेखा समतल (ढाल 0) हुन्छ? त्यहाँ f′ कति हुन्छ?","|x| छानी a=0 राख्नुहोस्। बायाँ/दायाँ दिशा बदल्नुहोस्। दुई ढाल कति छन्? अवकल परिभाषित छ?"],
q_h:"छिटो क्विज (३ प्रश्न)",
Q:[{q:"f(x)=x² भए f′(3) कति हुन्छ?",o:["3","6","9","2"],c:1,e:"f′(x)=2x, त्यसैले f′(3)=6।"},
{q:"ज्यामितीय रूपमा f′(a) भनेको …",o:["f(a) को मान","h=1 को जीवाको ढाल","x=a मा स्पर्श रेखाको ढाल","वक्रमुनिको क्षेत्रफल"],c:2,e:"h→0 हुँदा छेदक रेखाको सीमान्त स्थिति नै स्पर्श रेखा हो।"},
{q:"f(x)=|x| x=0 मा किन अवकलनीय छैन?",o:["बायाँ ढाल −1 र दायाँ ढाल +1 भएकाले सीमा अस्तित्वमा छैन","यो 0 मा निरन्तर छैन","0 मा यसको अवकल 0 हुन्छ","यो 0 मा परिभाषित छैन"],c:0,e:"|x| 0 मा निरन्तर छ, तर एकतर्फी सीमाहरू फरक भएकाले एउटै स्पर्श रेखा हुँदैन।"}],
ok:"✔ सही। ",no:"✘ मिलेन। ",sc:"अंक: "}};
let lang='en',dir=1,timer=null,ans=[null,null,null];
const A=()=>+$('a').value;
const H=()=>{const t=+$('h').value/100;return Math.max(0.001,2*t*t)};
function map(c,xr,yr){const W=c.width,Hh=c.height;return{X:x=>(x-xr[0])/(xr[1]-xr[0])*W,Y:y=>Hh-(y-yr[0])/(yr[1]-yr[0])*Hh}}
function axes(g,c,m,xr,yr){g.clearRect(0,0,c.width,c.height);g.strokeStyle='#232844';g.lineWidth=1;g.fillStyle='#9aa0bd';g.font='13px sans-serif';
 for(let x=Math.ceil(xr[0]);x<=xr[1];x++){g.beginPath();g.moveTo(m.X(x),0);g.lineTo(m.X(x),c.height);g.stroke();if(x)g.fillText(x,m.X(x)+3,m.Y(0)-4)}
 g.strokeStyle='#5a628a';g.lineWidth=1.5;g.beginPath();g.moveTo(0,m.Y(0));g.lineTo(c.width,m.Y(0));g.moveTo(m.X(0),0);g.lineTo(m.X(0),c.height);g.stroke()}
function curve(g,m,fn,xr,col,jump){g.strokeStyle=col;g.lineWidth=3;g.beginPath();let st=false,px=null;
 for(let i=0;i<=600;i++){const x=xr[0]+(xr[1]-xr[0])*i/600,y=fn(x);if(jump&&px!==null&&Math.abs(y-px)>.5){st=false}
 st?g.lineTo(m.X(x),m.Y(y)):g.moveTo(m.X(x),m.Y(y));st=true;px=y}g.stroke()}
function line(g,m,x0,y0,s,xr,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(m.X(xr[0]),m.Y(y0+s*(xr[0]-x0)));g.lineTo(m.X(xr[1]),m.Y(y0+s*(xr[1]-x0)));g.stroke()}
function dot(g,x,y,col,r){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#0b0e1a';g.lineWidth=2;g.stroke()}
function fmt(v){return (Math.abs(v)<1e-4&&v!==0?v.toExponential(2):v.toFixed(4))}
function draw(){
 const k=$('fn').value,o=F[k],a=A(),h=dir*H(),xr=[-3.5,3.5],L=T[lang];
 const c1=$('c1'),g=c1.getContext('2d'),m=map(c1,xr,o.y);
 axes(g,c1,m,xr,o.y);curve(g,m,o.f,xr,'#6aa8ff');
 const fa=o.f(a),fh=o.f(a+h),sl=(fh-fa)/h;
 line(g,m,a,fa,sl,xr,'#ff7a3d',2.5);
 const dne=(k==='ab'&&Math.abs(a)<1e-9);
 if(dne){line(g,m,0,0,-1,[-3.5,0],'#4cd6a0',2);line(g,m,0,0,1,[0,3.5],'#4cd6a0',2)}else line(g,m,a,fa,o.d(a),xr,'#4cd6a0',2);
 g.setLineDash([5,4]);g.strokeStyle='#ff7a3d';g.lineWidth=1.5;g.beginPath();g.moveTo(m.X(a),m.Y(fa));g.lineTo(m.X(a+h),m.Y(fa));g.lineTo(m.X(a+h),m.Y(fh));g.stroke();g.setLineDash([]);
 dot(g,m.X(a),m.Y(fa),'#f5b942',7);dot(g,m.X(a+h),m.Y(fh),'#ff7a3d',6);
 g.fillStyle='#ff7a3d';g.font='13px sans-serif';g.fillText('h',m.X(a+h/2)-3,m.Y(fa)-6);g.fillText('Δy',m.X(a+h)+6,m.Y((fa+fh)/2));
 // derivative graph
 const c2=$('c2'),g2=c2.getContext('2d'),m2=map(c2,xr,o.y2);
 axes(g2,c2,m2,xr,o.y2);curve(g2,m2,o.d,xr,'#f5b942',k==='ab');
 g2.setLineDash([4,4]);g2.strokeStyle='#5a628a';g2.beginPath();g2.moveTo(m2.X(a),0);g2.lineTo(m2.X(a),c2.height);g2.stroke();g2.setLineDash([]);
 dot(g2,m2.X(a),m2.Y(sl),'#ff7a3d',7);if(!dne)dot(g2,m2.X(a),m2.Y(o.d(a)),'#4cd6a0',5);
 $('av').textContent=a.toFixed(2);$('hv').textContent=(h).toFixed(3);
 const ex=dne?L.dne+' (−1 | +1)':fmt(o.d(a)),er=dne?'—':fmt(Math.abs(sl-o.d(a)));
 const items=[[L.fa,fmt(fa),''],[L.fah,fmt(fh),''],[L.dy,fmt(fh-fa),''],[L.sl,fmt(sl),'sec'],[L.ex,ex,'tan'],[L.er,er,'']];
 $('nums').innerHTML=items.map(i=>`<div class="n"><small>${i[0]}</small><span class="${i[2]}">${i[1]}</span></div>`).join('');
}
function setText(){const L=T[lang];
 $('t_title').textContent=L.title;$('t_sub').textContent=L.sub;$('t_exp_h').textContent=L.exp_h;$('t_exp').innerHTML=L.exp;
 $('t_sim_h').textContent=L.sim_h;$('t_leg').textContent=L.leg;$('t_a').textContent=L.a;$('t_h').textContent=L.h;$('t_dg').textContent=L.dg;
 $('dir').textContent=dir>0?L.dirR:L.dirL;$('anim').textContent=timer?L.stop:L.anim;
 $('t_try_h').textContent=L.try_h;$('t_try').innerHTML=L.try_.map(t=>`<li>${t}</li>`).join('');
 $('t_q_h').textContent=L.q_h;$('lang').textContent=lang==='en'?'नेपाली':'English';renderQuiz();draw()}
function renderQuiz(){const L=T[lang];
 $('quiz').innerHTML=L.Q.map((q,i)=>`<div><b>${i+1}. ${q.q}</b>`+q.o.map((t,j)=>{let cl='opt';if(ans[i]!==null){if(j===q.c)cl+=' ok';else if(j===ans[i])cl+=' bad'}
 return `<button class="${cl}" data-q="${i}" data-o="${j}" ${ans[i]!==null?'disabled':''}>${String.fromCharCode(65+j)}. ${t}</button>`}).join('')+
 `<div class="fb">${ans[i]===null?'':(ans[i]===q.c?L.ok:L.no)+q.e}</div></div>`).join('');
 const done=ans.filter(x=>x!==null).length;
 $('score').textContent=done?L.sc+ans.reduce((s,x,i)=>s+(x===L.Q[i].c?1:0),0)+' / 3':''}
$('quiz').addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;ans[+b.dataset.q]=+b.dataset.o;renderQuiz()});
$('lang').onclick=()=>{lang=lang==='en'?'ne':'en';setText()};
$('dir').onclick=()=>{dir=-dir;setText()};
$('fn').onchange=draw;$('a').oninput=draw;$('h').oninput=draw;
$('anim').onclick=()=>{
 if(timer){clearInterval(timer);timer=null;setText();return}
 if(+$('h').value<=0)$('h').value=100;
 timer=setInterval(()=>{let v=+$('h').value-1;if(v<=0){v=0;clearInterval(timer);timer=null;setText()}$('h').value=v;draw()},55);setText()};
setText();
</script></body></html>
