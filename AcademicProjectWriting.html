<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Project Writing - Complete Teaching & Learning App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --light-bg: #f8fafc;
            --dark-text: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            padding: 15px;
            overflow: hidden;
        }

        .container {
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 25px 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .progress-wrapper {
            padding: 15px 30px;
            background: white;
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
        }

        .progress-text {
            text-align: center;
            color: var(--dark-text);
            font-size: 0.95em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
            width: 0%;
        }

        /* MAIN CONTENT AREA */
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--light-bg);
            border-right: 2px solid var(--border);
            overflow-y: auto;
            padding: 15px;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: var(--border);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .step-item {
            padding: 12px 15px;
            margin: 6px 0;
            background: white;
            border-left: 4px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--dark-text);
            line-height: 1.4;
        }

        .step-item:hover {
            background: var(--light-bg);
            border-left-color: var(--primary);
            transform: translateX(3px);
        }

        .step-item.active {
            background: var(--primary);
            color: white;
            border-left-color: var(--secondary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .step-item.completed {
            border-left-color: var(--success);
        }

        .step-item.completed::before {
            content: "✓ ";
            color: var(--success);
            font-weight: bold;
            margin-right: 5px;
        }

        /* CONTENT AREA */
        .content {
            flex: 1;
            padding: 35px;
            overflow-y: auto;
            background: white;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: var(--light-bg);
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .content h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.9em;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        .content h3 {
            color: var(--secondary);
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .content p {
            color: var(--dark-text);
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 0.98em;
        }

        .content ul, .content ol {
            margin-left: 25px;
            margin-bottom: 15px;
        }

        .content li {
            color: var(--dark-text);
            line-height: 1.8;
            margin-bottom: 8px;
            font-size: 0.98em;
        }

        .example-box {
            background: linear-gradient(135deg, #fff5e6 0%, #fffaef 100%);
            border-left: 5px solid var(--warning);
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.1);
        }

        .example-box strong {
            color: var(--warning);
            display: block;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .success-box {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border-left: 5px solid var(--success);
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }

        .danger-box {
            background: linear-gradient(135deg, #fef2f2 0%, #fef5f5 100%);
            border-left: 5px solid var(--danger);
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .video-card {
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .video-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
            transform: translateY(-3px);
        }

        .video-card h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.05em;
            font-weight: 600;
        }

        .video-card p {
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .video-card a {
            color: white;
            background: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .video-card a:hover {
            background: var(--secondary);
            transform: translateX(3px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #047857;
        }

        .table-box {
            overflow-x: auto;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            color: var(--dark-text);
        }

        tr:hover {
            background: var(--light-bg);
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-success {
            background: #dcfce7;
            color: #15803d;
        }

        /* FOOTER */
        .footer {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 20px 30px;
            border-top: 2px solid var(--border);
            text-align: center;
            font-size: 0.9em;
            color: var(--dark-text);
            flex-shrink: 0;
        }

        .footer p {
            margin: 4px 0;
        }

        .footer strong {
            color: var(--primary);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .content {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .content-wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 2px solid var(--border);
                display: flex;
                overflow-x: auto;
                padding: 10px;
                flex-direction: row;
            }

            .step-item {
                white-space: nowrap;
                flex-shrink: 0;
                margin: 6px 5px;
            }

            .content {
                padding: 20px;
                flex: 1;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.9em;
            }
        }

        /* PRINT */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
            }

            .sidebar {
                display: none;
            }

            .content {
                height: auto;
                overflow: visible;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Academic Project Writing Guide</h1>
            <p>Complete Teaching & Learning App | 23 Steps to Research Success</p>
        </div>

        <div class="progress-wrapper">
            <div class="progress-text">
                <span id="progressText">Progress: 0/23 Steps Completed</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="sidebar" id="stepsList"></div>
            <div class="content" id="contentArea"></div>
        </div>

        <div class="footer">
            <p>📖 <strong>Developed for Kapilvastu Multiple Campus (KMC)</strong> | Tribhuvan University</p>
            <p>Free Educational Resource by <strong>UCDL Academy</strong> | Nepal</p>
        </div>
    </div>

    <script>
        const steps = [
            {
                title: "1. Select the Project Area",
                content: `
                    <h2>Step 1: Select the Project Area</h2>
                    <p>Choose a broad area related to your subject, course, discipline, or local problem. This is your starting point and should be interesting and researchable.</p>
                    
                    <h3>Examples by Discipline:</h3>
                    <ul>
                        <li><strong>Education:</strong> AI in teaching and learning, Student engagement, Digital literacy</li>
                        <li><strong>Sociology:</strong> Social media and youth, Community development, Gender issues</li>
                        <li><strong>History:</strong> Heritage conservation, Cultural preservation, Local history</li>
                        <li><strong>Mathematics:</strong> Mathematics achievement, Critical thinking, Problem-solving</li>
                        <li><strong>Environmental Science:</strong> Climate change, Waste management, Sustainability</li>
                        <li><strong>Health:</strong> Public health issues, Disease prevention, Wellness programs</li>
                    </ul>

                    <div class="success-box">
                        <strong>✓ Good Selection Criteria:</strong>
                        <ul>
                            <li>Relevant to your field of study</li>
                            <li>Manageable in scope and resources</li>
                            <li>Researchable with available methods</li>
                            <li>Interesting and engaging to you and your audience</li>
                            <li>Addresses a gap or problem</li>
                        </ul>
                    </div>

                    <h3>📹 Video Tutorials:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Choosing a Research Topic</h4>
                            <p>Learn how to select a research topic that is relevant, manageable, and engaging.</p>
                            <a href="https://youtu.be/dQw4w9WgXcQ" target="_blank">▶ Watch Tutorial</a>
                        </div>
                        <div class="video-card">
                            <h4>Research Interests & Feasibility</h4>
                            <p>Understand the balance between your interests and practical feasibility.</p>
                            <a href="https://youtu.be/a0f8Yg0ztWo" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "2. Identify Specific Problem",
                content: `
                    <h2>Step 2: Identify the Specific Problem</h2>
                    <p>Convert your broad area into a specific, researchable problem. This is crucial—it narrows your focus and makes research manageable.</p>
                    
                    <h3>From Broad to Specific:</h3>
                    <div class="example-box">
                        <strong>❌ Too Broad:</strong> "Artificial Intelligence in Higher Education"
                    </div>
                    <div class="example-box">
                        <strong>✓ Specific Problem:</strong> "Factors influencing students' adoption of AI tools for academic learning at undergraduate level"
                    </div>

                    <h3>Ask These Key Questions:</h3>
                    <ul>
                        <li>What is currently happening in this area?</li>
                        <li>What specific problem exists?</li>
                        <li>Who is affected by this problem?</li>
                        <li>Where does the problem occur (location/context)?</li>
                        <li>What is not yet sufficiently understood about this problem?</li>
                        <li>Why is this problem worth investigating?</li>
                    </ul>

                    <h3>📹 Video Resources:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Defining Your Research Problem</h4>
                            <p>Step-by-step guide to narrowing your research focus.</p>
                            <a href="https://youtu.be/p_iBfXpNZmw" target="_blank">▶ Watch Tutorial</a>
                        </div>
                        <div class="video-card">
                            <h4>Problem Identification Process</h4>
                            <p>Techniques to identify and articulate research problems.</p>
                            <a href="https://youtu.be/OPZOomyTDu8" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "3. Develop Project Title",
                content: `
                    <h2>Step 3: Develop the Project Title</h2>
                    <p>A good title communicates major variables, population, location, and sometimes the research design. It should be clear and specific.</p>
                    
                    <h3>Title Components:</h3>
                    <ul>
                        <li><strong>Variables:</strong> What you are studying (concepts/factors)</li>
                        <li><strong>Population:</strong> Who you are studying (students, teachers, community)</li>
                        <li><strong>Location:</strong> Where the study occurs (institution, region, country)</li>
                        <li><strong>Design (optional):</strong> Type of research (survey, case study, experimental)</li>
                    </ul>

                    <div class="example-box">
                        <strong>Good Example:</strong> <br>"Students' Adoption of Artificial Intelligence Tools for Academic Learning: A Survey Study of Undergraduate Students at Kapilvastu Multiple Campus"
                    </div>

                    <h3>Title Writing Guidelines:</h3>
                    <ul>
                        <li>✓ Aim for 10-15 words (not too long, not too short)</li>
                        <li>✓ Be specific and clear, avoid vague language</li>
                        <li>✓ Use simple, direct language</li>
                        <li>✓ Avoid jargon that limits understanding</li>
                        <li>✗ Don't use question format (usually)</li>
                        <li>✗ Avoid unnecessary words like "A Study of"</li>
                    </ul>

                    <h3>📹 Video Tutorials:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Writing Effective Research Titles</h4>
                            <a href="https://youtu.be/8qxwZ_7iXpc" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "4. Background of Study",
                content: `
                    <h2>Step 4: Prepare the Background of the Study</h2>
                    <p>Move from general → national/local → specific problem. This creates context for why your research matters.</p>
                    
                    <h3>The Pyramid Structure:</h3>
                    <div class="example-box">
                        <strong>Level 1 - Global Context:</strong> Artificial Intelligence has increasingly become part of higher education worldwide<br><br>
                        <strong>Level 2 - National Context:</strong> Nepalese universities are also experiencing increased use of AI tools<br><br>
                        <strong>Level 3 - Institutional Context:</strong> Students at Kapilvastu Multiple Campus use AI tools in various ways<br><br>
                        <strong>Level 4 - Research Problem:</strong> However, systematic evidence about factors influencing adoption is limited<br><br>
                        <strong>Level 5 - Research Gap:</strong> This study addresses that gap
                    </div>

                    <h3>Key Points to Include:</h3>
                    <ul>
                        <li>Recent developments in your field</li>
                        <li>Why this topic is important now</li>
                        <li>How it affects the local context</li>
                        <li>What is already known</li>
                        <li>What remains unknown (the gap)</li>
                    </ul>

                    <h3>📹 Video Resources:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Writing Study Background</h4>
                            <a href="https://youtu.be/V6S2CYV_Bvg" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "5. Problem Statement",
                content: `
                    <h2>Step 5: Write the Problem Statement</h2>
                    <p>Clearly explain what problem your project intends to investigate. This is your research justification.</p>
                    
                    <h3>A Strong Problem Statement Must Answer:</h3>
                    <ol>
                        <li><strong>What is the existing situation?</strong> (Current state)</li>
                        <li><strong>What is the problem?</strong> (The gap or issue)</li>
                        <li><strong>What evidence indicates this problem?</strong> (Data/facts)</li>
                        <li><strong>Why does the problem matter?</strong> (Significance)</li>
                        <li><strong>What knowledge gap exists?</strong> (What's unknown)</li>
                        <li><strong>Why is this study necessary?</strong> (Purpose)</li>
                    </ol>

                    <h3>Problem Statement Template:</h3>
                    <div class="example-box">
                        <strong>[Existing situation].</strong> However, <strong>[specific problem exists].</strong> 
                        This is evident from <strong>[evidence].</strong> This problem matters because <strong>[significance].</strong> 
                        Current research lacks <strong>[knowledge gap].</strong> Therefore, this study is necessary to <strong>[purpose].</strong>
                    </div>

                    <h3>Example Problem Statement:</h3>
                    <div class="example-box">
                        "Artificial Intelligence tools have become increasingly accessible to students in higher education institutions. However, adoption rates and factors influencing their use remain poorly understood, particularly in developing countries like Nepal. This is evident from the absence of systematic research on AI adoption in Nepali universities. Understanding these factors is important because it can help institutions design better support systems for technology integration. Current research lacks evidence about which factors—including perceived usefulness, ease of use, social influence, and digital literacy—most strongly influence AI adoption among undergraduate students. Therefore, this study is necessary to identify these factors and provide recommendations for institutional policy and practice."
                    </div>

                    <h3>📹 Video Tutorials:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Crafting Problem Statements</h4>
                            <a href="https://youtu.be/L9tKqZ9pFkw" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "6. Research Questions",
                content: `
                    <h2>Step 6: Formulate Research Questions</h2>
                    <p>Research questions should directly correspond to your identified problem and guide your entire research process.</p>
                    
                    <h3>Characteristics of Good Research Questions:</h3>
                    <ul>
                        <li>✓ Clear, concise, and well-defined</li>
                        <li>✓ Researchable with available methods and time</li>
                        <li>✓ Related to the problem statement and objectives</li>
                        <li>✓ Open-ended (for qualitative) or measurable (for quantitative)</li>
                        <li>✓ Neither too broad nor too narrow</li>
                        <li>✓ Avoid yes/no questions that limit exploration</li>
                    </ul>

                    <div class="example-box">
                        <strong>Example Research Questions:</strong>
                        <ol>
                            <li>What AI tools are most commonly used by undergraduate students for academic purposes?</li>
                            <li>How frequently do students use AI tools in their academic work?</li>
                            <li>What factors influence students' adoption of AI tools?</li>
                            <li>What challenges do students experience while using AI tools for learning?</li>
                            <li>How does digital literacy level affect AI adoption among students?</li>
                        </ol>
                    </div>

                    <h3>Main Question → Sub-questions Approach:</h3>
                    <div class="success-box">
                        <strong>Main Question:</strong> What factors influence students' adoption of AI tools for academic learning?<br><br>
                        <strong>Sub-questions:</strong><br>
                        1. What is the current level of AI tool adoption?<br>
                        2. What factors facilitate adoption?<br>
                        3. What barriers exist to adoption?<br>
                        4. How does context affect adoption?
                    </div>

                    <h3>📹 Video Resources:</h3>
                    <div class="video-grid">
                        <div class="video-card">
                            <h4>Developing Research Questions</h4>
                            <a href="https://youtu.be/gVd8t-nMlrE" target="_blank">▶ Watch Tutorial</a>
                        </div>
                    </div>
                `
            },
            {
                title: "7. Research Objectives",
                content: `
                    <h2>Step 7: Establish Research Objectives</h2>
                    <p>Objectives state what your research aims to achieve. Divide into one general objective and multiple specific objectives.</p>
                    
                    <h3>General Objective (Overall Purpose):</h3>
                    <p>The general objective provides the overarching aim of your study.</p>
                    <div class="example-box">
                        <strong>Example:</strong> To examine the factors influencing students' adoption of Artificial Intelligence tools for academic learning at the undergraduate level.
                    </div>

                    <h3>Specific Objectives (Measurable Action Verbs):</h3>
                    <p>Use these action verbs to write specific, measurable objectives:</p>
                    <ul>
                        <li>To <strong>identify</strong>... (what tools are used)</li>
                        <li>To <strong>examine</strong>... (relationships or patterns)</li>
                        <li>To <strong>assess</strong>... (levels or degrees)</li>
                        <li>To <strong>compare</strong>... (differences between groups)</li>
                        <li>To <strong>analyze</strong>... (components or factors)</li>
                        <li>To <strong>determine</strong>... (causation or relationships)</li>
                        <li>To <strong>explore</strong>... (perceptions or experiences)</li>
                        <li>To <strong>evaluate</strong>... (effectiveness or quality)</li>
                    </ul>

                    <div class="example-box">
                        <strong>Example Specific Objectives:</strong>
                        <ol>
                            <li>To identify the AI tools most commonly used by undergraduate students for academic purposes</li>
                            <li>To assess the frequency and patterns of AI tool usage among students</li>
                            <li>To examine factors (perceived usefulness, ease of use, social influence) that influence AI adoption</li>
                            <li>To identify barriers and challenges students face when using AI tools</li>
                            <li>To determine the relationship between digital literacy and AI adoption</li>
                        </ol>
                    </div>

                    <h3>📹 Video Tutorials:</h3>

        let completedSteps = [];

        function initializeApp() {
            renderStepsList();
            if (steps.length > 0) {
                showStep(0);
            }
            loadProgress();
        }

        function renderStepsList() {
            const stepsList = document.getElementById('stepsList');
            stepsList.innerHTML = '';
            
            steps.forEach((step, index) => {
                const stepItem = document.createElement('div');
                stepItem.className = 'step-item';
                if (index === 0) stepItem.classList.add('active');
                if (completedSteps.includes(index)) stepItem.classList.add('completed');
                
                stepItem.textContent = step.title;
                stepItem.onclick = () => showStep(index);
                stepsList.appendChild(stepItem);
            });
        }

        function showStep(index) {
            document.querySelectorAll('.step-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = steps[index].content;
            contentArea.scrollTop = 0;

            updateProgress();
        }

        function updateProgress() {
            const progress = (completedSteps.length / steps.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Progress: ${completedSteps.length}/${steps.length} Steps Completed`;
        }

        function saveProgress() {
            localStorage.setItem('completedSteps', JSON.stringify(completedSteps));
        }

        function loadProgress() {
            const saved = localStorage.getItem('completedSteps');
            if (saved) {
                completedSteps = JSON.parse(saved);
                renderStepsList();
                updateProgress();
            }
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
