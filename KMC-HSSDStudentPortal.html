    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-0: #0a0a0a;
            --surface-1: #1a1a1a;
            --surface-2: #ffffff;
            --text-primary: #e5e5e5;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --border: rgba(255, 255, 255, 0.1);
            --border-strong: rgba(255, 255, 255, 0.2);
            --accent-color: #fb923c;
            --accent-light: rgba(251, 146, 60, 0.2);
            --accent-lighter: rgba(251, 146, 60, 0.08);
            --radius: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--surface-0);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .portal-container {
            display: flex;
            height: 100vh;
            background: var(--surface-0);
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: var(--surface-1);
            border-right: 0.5px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 0.5px solid var(--border);
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.1), rgba(245, 158, 11, 0.1));
        }

        .sidebar-header h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .sidebar-header p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Language Toggle */
        .language-toggle {
            padding: 8px 12px;
            display: flex;
            gap: 4px;
            border-bottom: 0.5px solid var(--border);
        }

        .lang-btn {
            flex: 1;
            padding: 4px 8px;
            border: 0.5px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .lang-btn.active {
            border: 1px solid var(--accent-color);
            background: var(--accent-lighter);
            color: var(--accent-color);
        }

        .lang-btn:hover {
            background: var(--accent-lighter);
        }

        /* Menu Scroll */
        .portal-menu {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px;
        }

        .portal-menu::-webkit-scrollbar {
            width: 6px;
        }

        .portal-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .portal-menu::-webkit-scrollbar-thumb {
            background: rgba(251, 146, 60, 0.3);
            border-radius: 3px;
        }

        .portal-menu::-webkit-scrollbar-thumb:hover {
            background: rgba(251, 146, 60, 0.5);
        }

        /* Menu Items */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin: 2px 0;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            padding-left: 9px;
        }

        .menu-item:hover:not(.active) {
            background: var(--accent-lighter);
        }

        .menu-item.active {
            background: var(--accent-light);
            color: var(--accent-color);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }

        .menu-item i {
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu-item .label {
            flex: 1;
            text-align: left;
        }

        .menu-item .chevron {
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .menu-item .chevron.rotated {
            transform: rotate(180deg);
        }

        /* Submenu */
        .submenu {
            max-height: 0;
            overflow: hidden;
            animation: slideDown 0.3s ease forwards;
            margin-left: 8px;
            border-left: 2px solid rgba(251, 146, 60, 0.3);
            padding-left: 0;
        }

        .submenu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 2px 0;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 400;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
            padding-left: 9px;
        }

        .submenu-item:hover:not(.active) {
            background: var(--accent-lighter);
        }

        .submenu-item.active {
            background: rgba(251, 146, 60, 0.15);
            color: var(--accent-color);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }

        @keyframes slideDown {
            from {
                max-height: 0;
                opacity: 0;
            }
            to {
                max-height: 400px;
                opacity: 1;
            }
        }

        .submenu.collapsed {
            max-height: 0;
            animation: slideUp 0.3s ease forwards;
            pointer-events: none;
        }

        @keyframes slideUp {
            from {
                max-height: 400px;
                opacity: 1;
            }
            to {
                max-height: 0;
                opacity: 0;
            }
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 12px;
            border-top: 0.5px solid var(--border);
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 24px;
            border-bottom: 0.5px solid var(--border);
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.05), rgba(245, 158, 11, 0.05));
        }

        .content-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .content-header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Content Body */
        .content-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: block;
        }

        #pageContent {
            display: block;
            width: 100%;
        }

        #pageContent.content-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-align: center;
            max-width: 400px;
            margin: auto;
        }

        .content-body::-webkit-scrollbar {
            width: 6px;
        }

        .content-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-body::-webkit-scrollbar-thumb {
            background: rgba(251, 146, 60, 0.3);
            border-radius: 3px;
        }

        .content-body::-webkit-scrollbar-thumb:hover {
            background: rgba(251, 146, 60, 0.5);
        }

        .content-placeholder {
            text-align: center;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .content-placeholder::before {
            content: "📝";
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .content-html {
            text-align: left;
            max-width: 700px;
            width: 100%;
        }

        .content-html a {
            color: #fb923c;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .content-html a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .content-html h3, .content-html h4 {
            color: #fb923c;
            margin-top: 0;
        }

        .content-html ul, .content-html ol {
            padding-left: 20px;
        }

        .content-html li {
            margin: 4px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
            }
        }
    </style>

                        <div style="background: rgba(251, 146, 60, 0.08); padding: 12px; border-radius: 8px;">
                            <strong>⏰ Office Hours:</strong>
                            <p style="margin: 4px 0; font-size: 12px;">Monday - Friday: 9:00 AM - 5:00 PM</p>
                            <p style="margin: 4px 0; font-size: 12px;">Saturday and Sunday: Holidays (Closed)</p>
                            <p style="margin: 4px 0; font-size: 12px;">Public Holidays: Closed</p>
                        </div>
                    </div>
                `
            }
        };

        // Menu Structure
        const menuStructure = [
            { key: 'home', labelKey: 'home', icon: 'ti-home' },
            { key: 'notices', labelKey: 'notices', icon: 'ti-bell' },
            {
                key: 'academic',
                labelKey: 'academic',
                icon: 'ti-book',
                children: [
                    { key: 'programs', labelKey: 'programs' },
                    { key: 'syllabus', labelKey: 'syllabus' },
                    { key: 'routine', labelKey: 'routine' },
                    { key: 'faculty', labelKey: 'faculty' }
                ]
            },
            {
                key: 'examination',
                labelKey: 'examination',
                icon: 'ti-clipboard',
                children: [
                    { key: 'examForm', labelKey: 'examForm' },
                    { key: 'examRoutine', labelKey: 'examRoutine' },
                    { key: 'centre', labelKey: 'centre' },
                    { key: 'admitCard', labelKey: 'admitCard' },
                    { key: 'results', labelKey: 'results' }
                ]
            },
            {
                key: 'learning',
                labelKey: 'learning',
                icon: 'ti-books',
                children: [
                    { key: 'materials', labelKey: 'materials' },
                    { key: 'assignments', labelKey: 'assignments' },
                    { key: 'library', labelKey: 'library' },
                    { key: 'classes', labelKey: 'classes' }
                ]
            },
            {
                key: 'research',
                labelKey: 'research',
                icon: 'ti-microscope',
                children: [
                    { key: 'methodology', labelKey: 'methodology' },
                    { key: 'topics', labelKey: 'topics' },
                    { key: 'tools', labelKey: 'tools' },
                    { key: 'publications', labelKey: 'publications' }
                ]
            },
            {
                key: 'ai',
                labelKey: 'ai',
                icon: 'ti-brain',
                children: [
                    { key: 'aiTools', labelKey: 'aiTools' },
                    { key: 'promptEng', labelKey: 'promptEng' },
                    { key: 'ethics', labelKey: 'ethics' }
                ]
            },
            {
                key: 'career',
                labelKey: 'career',
                icon: 'ti-briefcase',
                children: [
                    { key: 'jobs', labelKey: 'jobs' },
                    { key: 'internship', labelKey: 'internship' },
                    { key: 'fellowship', labelKey: 'fellowship' },
                    { key: 'higher', labelKey: 'higher' }
                ]
            },
            {
                key: 'events',
                labelKey: 'events',
                icon: 'ti-calendar-event',
                children: [
                    { key: 'seminar', labelKey: 'seminar' },
                    { key: 'workshop', labelKey: 'workshop' },
                    { key: 'fieldVisit', labelKey: 'fieldVisit' },
                    { key: 'calendar', labelKey: 'calendar' }
                ]
            },
            {
                key: 'services',
                labelKey: 'services',
                icon: 'ti-help',
                children: [
                    { key: 'forms', labelKey: 'forms' },
                    { key: 'helpDesk', labelKey: 'helpDesk' },
                    { key: 'feedback', labelKey: 'feedback' },
                    { key: 'scholarship', labelKey: 'scholarship' }
                ]
            },
            { key: 'contact', labelKey: 'contact', icon: 'ti-phone' }
        ];

        // State
        let currentLanguage = 'en';
        let selectedPage = 'home';
        let expandedSections = {};

        // Initialize
        function init() {
            const savedLang = localStorage.getItem('kmc-portal-lang');
            const savedPage = localStorage.getItem('kmc-portal-page');
            
            if (savedLang) {
                currentLanguage = savedLang;
            }
            if (savedPage) {
                selectedPage = savedPage;
            }

            renderMenu();
            updateLanguageUI();
            updateContent();
        }

        // Render Menu
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            menuStructure.forEach(item => {
                const menuItem = createMenuItemElement(item);
                container.appendChild(menuItem);
            });
        }

        // Create Menu Item Element
        function createMenuItemElement(item) {
            const wrapper = document.createElement('div');
            const hasChildren = item.children && item.children.length > 0;

            const button = document.createElement('button');
            button.className = 'menu-item' + (selectedPage === item.key ? ' active' : '');
            button.innerHTML = `
                <i class="ti ${item.icon}"></i>
                <span class="label">${translations[currentLanguage][item.labelKey]}</span>
                ${hasChildren ? '<i class="ti ti-chevron-down chevron"></i>' : ''}
            `;

            button.onclick = () => {
                if (hasChildren) {
                    toggleSection(item.key);
                } else {
                    selectPage(item.key);
                }
            };

            wrapper.appendChild(button);

            // Add submenu if has children
            if (hasChildren) {
                const submenu = document.createElement('div');
                submenu.className = 'submenu' + (expandedSections[item.key] ? '' : ' collapsed');
                submenu.id = `submenu-${item.key}`;

                item.children.forEach(child => {
                    const childButton = document.createElement('button');
                    childButton.className = 'submenu-item' + (selectedPage === child.key ? ' active' : '');
                    childButton.innerHTML = `<span>• ${translations[currentLanguage][child.labelKey]}</span>`;
                    childButton.onclick = () => selectPage(child.key);
                    submenu.appendChild(childButton);
                });

                wrapper.appendChild(submenu);
            }

            return wrapper;
        }

        // Toggle Section
        function toggleSection(key) {
            expandedSections[key] = !expandedSections[key];
            const submenu = document.getElementById(`submenu-${key}`);
            
            if (expandedSections[key]) {
                submenu.classList.remove('collapsed');
            } else {
                submenu.classList.add('collapsed');
            }

            const button = event.target.closest('.menu-item');
            const chevron = button.querySelector('.chevron');
            if (chevron) {
                chevron.classList.toggle('rotated');
            }
        }

        // Select Page
        function selectPage(key) {
            selectedPage = key;
            localStorage.setItem('kmc-portal-page', key);
            
            // Update active states
            document.querySelectorAll('.menu-item, .submenu-item').forEach(el => {
                el.classList.remove('active');
            });
            
            document.querySelectorAll(`[data-page="${key}"]`).forEach(el => {
                el.classList.add('active');
            });

            // Re-render to update active states
            renderMenu();
            updateContent();
        }

        // Update Content
        function updateContent() {
            const content = contentMap[selectedPage];
            if (!content) return;

            const titleKey = content.titleKey;
            const pageTitle = document.getElementById('pageTitle');
            const pageContent = document.getElementById('pageContent');

            pageTitle.textContent = translations[currentLanguage][titleKey];

            if (content.html) {
                pageContent.innerHTML = content.html;
                pageContent.className = 'content-html';
            } else {
                const contentText = content.content || translations[currentLanguage][content.contentKey] || 'Content not available';
                pageContent.textContent = contentText;
                pageContent.className = 'content-placeholder';
            }
        }

        // Change Language
        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('kmc-portal-lang', lang);

            document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
            document.getElementById('langNeBtn').classList.toggle('active', lang === 'ne');

            updateLanguageUI();
            renderMenu();
            updateContent();
        }

        // Update Language UI
        function updateLanguageUI() {
            document.getElementById('headerSubtitle').textContent = translations[currentLanguage].headerSubtitle;
            document.getElementById('pageSubtitle').textContent = translations[currentLanguage].pageSubtitle;
            document.getElementById('sidebarFooter').textContent = translations[currentLanguage].sidebarFooter;

            // Update lang buttons
            document.getElementById('langEnBtn').classList.toggle('active', currentLanguage === 'en');
            document.getElementById('langNeBtn').classList.toggle('active', currentLanguage === 'ne');
        }

        // Add data-page attribute to menu items for easier selection
        document.addEventListener('DOMContentLoaded', function() {
            init();
        });
    </script>
</body>
</html>
