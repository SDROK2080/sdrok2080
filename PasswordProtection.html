<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Box */
        #loginBox {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        #loginBox h2 {
            margin-bottom: 10px;
        }

        #password {
            width: 100%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #153eaa;
        }

        #message {
            color: red;
            margin-top: 12px;
            min-height: 20px;
        }

        /* Protected Content */
        #protectedPage {
            display: none;
            width: 95%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        .logout {
            width: auto;
            padding: 10px 20px;
            background: #dc2626;
            margin-top: 20px;
        }

        .logout:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

    <!-- Password Screen -->
    <div id="loginBox">
        <h2>🔐 Protected Page</h2>
        <p>Please enter the password to continue.</p>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="off"
        >

        <button onclick="checkPassword()">
            Unlock Page
        </button>

        <div id="https://sdrok2080.github.io/sdrok2080/ResearchDesignApp.html"></div>
    </div>


    <!-- Protected Content -->
    <div id="protectedPage">

        <h1>Welcome to the Protected Page</h1>

        <p>
            Congratulations! You have entered the correct password.
        </p>

        <hr>

        <h2>KMC-HSSD / SDRI</h2>

        <p>
            This is your protected HTML content. You can place your
            documents, research resources, notices, links, or other
            website content here.
        </p>

        <button class="logout" onclick="logout()">
            🔒 Lock Page
        </button>

    </div>


    <script>

        // ==========================================
        // CHANGE YOUR PASSWORD HERE
        // ==========================================

        const correctPassword = "KMC@2026";


        // ==========================================
        // CHECK PASSWORD
        // ==========================================

        function checkPassword() {

            const enteredPassword =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            if (enteredPassword === correctPassword) {

                // Hide login screen
                document.getElementById("loginBox").style.display = "none";

                // Show protected content
                document.getElementById("protectedPage").style.display = "block";

                // Save login status for this browser tab
                sessionStorage.setItem("authenticated", "true");

            } else {

                message.textContent = "❌ Incorrect password!";

                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }


        // ==========================================
        // ENTER KEY SUPPORT
        // ==========================================

        document.getElementById("password").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            }
        );


        // ==========================================
        // CHECK EXISTING LOGIN
        // ==========================================

        window.onload = function() {

            if (sessionStorage.getItem("authenticated") === "true") {

                document.getElementById("loginBox").style.display = "none";

                document.getElementById("protectedPage").style.display = "block";
            }
        };


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            sessionStorage.removeItem("authenticated");

            document.getElementById("protectedPage").style.display = "none";

            document.getElementById("loginBox").style.display = "block";

            document.getElementById("password").value = "";

            document.getElementById("message").textContent = "";
        }

    </script>
</body>
</html>
