<style>

@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141b18;--card:#1c2622;--tx:#e6ede9;--mu:#9bb0a5;--ac:#6fbf9a;--ac2:#25382f;--bd:#2c3a34}}
:root[data-theme=dark]{--bg:#141b18;--card:#1c2622;--tx:#e6ede9;--mu:#9bb0a5;--ac:#6fbf9a;--ac2:#25382f;--bd:#2c3a34}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,'Noto Serif Devanagari',serif;padding-bottom:70px}
main{max-width:760px;margin:auto;padding:16px}
h1,h2,h3{font-weight:600;line-height:1.25}
.top{display:flex;gap:8px;justify-content:flex-end;padding:8px 16px;max-width:760px;margin:auto}
select,button,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.hero{text-align:center;padding:36px 12px;background:linear-gradient(180deg,var(--ac2),transparent);border-radius:24px}
.hero svg{width:130px;height:130px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
nav button{flex:1;min-width:64px;border:0;border-radius:0;background:none;font-size:12px;padding:10px 4px}
nav button.on{color:var(--ac);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.time{font-size:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:6px;height:100px}.chart div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.cal i{aspect-ratio:1;border-radius:5px;background:var(--ac2)}.cal i.d{background:var(--ac)}
label{display:block;margin-top:8px;font-size:14px;color:var(--mu)}input,textarea,select{width:100%}
.lock{opacity:.5}.m{color:var(--mu);font-size:14px}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
.two{display:grid;gap:12px}@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><select id="lang" aria-label="Language"><option value="en">English</option><option value="ne">नेपाली</option><option value="hi">हिन्दी</option></select><button id="th" aria-label="Theme">◐</button></div>
<main id="app"></main><nav id="nav"></nav>

const MODS=[
["Introduction","परिचय","परिचय",["Vipassana means seeing things as they are; a traditional insight practice from the Buddhist tradition.","Core principles: observe sensations, thoughts and emotions without judging.","Mindfulness is steady awareness of the present moment."]],
["Preparing for Meditation","तयारी","तैयारी",["Choose a quiet, clean place with few distractions.","Sit upright but relaxed on a chair or cushion; keep the spine comfortable.","Wear loose clothing, pick a regular time, and set a simple intention."]],
["Basic Practice","आधारभूत अभ्यास","बुनियादी अभ्यास",["Rest attention on the natural breath without changing it.","When the mind wanders, notice it and gently return.","Then widen awareness to body sensations, thoughts and emotions."]],
["Core Concepts","मूल अवधारणा","मूल अवधारणाएँ",["Impermanence (anicca): experiences arise and pass.","Equanimity: balanced response to pleasant and unpleasant experience.","Craving and aversion: notice the pull toward or away from experience."]],

const RES=[
{k:"v",c:"Mindfulness",t:"UCLA Mindful: Getting Started videos",d:"Short introductions: what mindfulness is, choosing a meditation, selecting a posture, and the science of mindfulness.",du:"see page",by:"Diana Winston, UCLA Mindful",l:"English",src:"UCLA Health",lic:"CC BY-NC-ND 4.0",u:"https://www.uclahealth.org/programs/uclamindful/free-guided-meditations/getting-started"},
{k:"v",c:"Guided Meditation",t:"Complete Meditation Instructions (guided practice, ASL edition)",d:"A 19-minute guided practice for mindfulness. The same page lists a 5-min breathing meditation, 12-min breath-sound-body, 9-min loving-kindness and 3-min body scan videos.",du:"19 min",by:"UCLA Mindful",l:"English / ASL",src:"UCLA Health",lic:"CC BY-NC-ND 4.0",u:"https://www.uclahealth.org/programs/uclamindful/free-guided-meditations/getting-started"},
{k:"v",c:"Breathing Meditation",t:"Cultivate Calm and Focus: 5-minute Breathing Meditation",d:"A short breath-awareness practice, listed on the UCLA Mindful getting-started page (video).",du:"5 min",by:"UCLA Mindful",l:"English / ASL",src:"UCLA Health",lic:"CC BY-NC-ND 4.0",u:"https://www.uclahealth.org/programs/uclamindful/free-guided-meditations/getting-started"},
{k:"v",c:"Body Awareness",t:"Body Scan Meditation: 3-minute Practice",d:"A short body scan for relaxation and awareness; longer audio body scans are on the Guided Meditations page.",du:"3 min",by:"UCLA Mindful",l:"English / ASL",src:"UCLA Health",lic:"CC BY-NC-ND 4.0",u:"https://www.uclahealth.org/programs/uclamindful/free-guided-meditations/getting-started"},
{k:"a",c:"Guided Meditation",t:"UCLA Mindful: Guided Meditations (audio, with transcripts)",d:"Breathing, complete instructions, loving-kindness and more, with transcripts. Free to stream or download.",du:"3-19 min",by:"Diana Winston, UCLA Mindful",l:"English",src:"UCLA Health",lic:"CC BY-NC-ND 4.0",u:"https://www.uclahealth.org/programs/marc/free-guided-meditations/guided-meditations"},
{k:"a",c:"Meditation Talks",t:"Satipatthana Sutta, part 1: The Direct Path to Liberation (talk)",d:"First of a talk series on the foundations of mindfulness, recorded at the Insight Meditation Society Forest Refuge, 2004.",du:"59 min",by:"Joseph Goldstein",l:"English",src:"Dharma Seed",lic:"CC BY-NC-ND 4.0",u:"https://ats.dharmaseed.org/talks/280"},
{k:"a",c:"Meditation Talks",t:"Satipatthana Sutta, part 3: Concentration and Contemplation (talk)",d:"Third talk in the same series, recorded April 2004.",du:"64 min",by:"Joseph Goldstein",l:"English",src:"Dharma Seed",lic:"CC BY-NC-ND 4.0",u:"https://dharmaseed.org/talks/282"},
{k:"r",c:"Vipassana Introduction",t:"The Foundations of Mindfulness: Satipatthana Sutta",d:"Translation of Majjhima Nikaya 10 with introduction and notes (19 pp).",by:"Nyanasatta Thera (trans.)",org:"Access to Insight",l:"English",src:"Access to Insight",lic:"Free distribution (Dhamma gift); check site terms",u:"https://accesstoinsight.org/lib/authors/nyanasatta/"},
{k:"r",c:"Meditation Guides",t:"The Way of Mindfulness: The Satipatthana Sutta and Its Commentary",d:"Sutta, commentary by Buddhaghosa and selections from the tika, with notes on Satipatthana meditation.",by:"Soma Thera",org:"Access to Insight",l:"English",src:"Access to Insight",lic:"Made available for free distribution",u:"https://accesstoinsight.org/ati/lib/authors/soma/wayof.html"},
{k:"r",c:"Meditation Research",t:"How Does Mindfulness Meditation Work? Mechanisms of Action (abstract)",d:"Review proposing four components: attention regulation, body awareness, emotion regulation, and change in perspective on the self. Record and abstract only.",by:"Hölzel, Lazar, Gard, Schuman-Olivier, Vago, Ott",org:"Perspectives on Psychological Science, 2011",l:"English",src:"MGH publication record",lic:"Publisher copyright: link only, not hosted here",u:"https://www.nmr.mgh.harvard.edu/publications/journal_articles/396"}];
const TYPES=["Breath awareness","Body scan","Open awareness","Other"],MOODS=["Restless","Tense","Neutral","Calm","Peaceful"];
const S=JSON.parse(localStorage.getItem("vip")||'{"fav":[],"mine":[],"sessions":[],"journal":[],"lessons":{},"goal":70,"lang":"en"}');
S.fav=S.fav||[];S.mine=S.mine||[];let q="";
const save=()=>{try{localStorage.setItem("vip",JSON.stringify(S))}catch(e){}};
let L=S.lang||"en",tab="home",tm={dur:600,left:600,run:false,end:0,id:0,int:0,last:0};
const t=k=>T[L][k]||T.en[k],$=s=>document.querySelector(s),day=d=>new Date(d).toISOString().slice(0,10),today=()=>day(Date.now());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bell(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=528;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+3);o.start();o.stop(a.currentTime+3)}catch(e){}}
function log(min,type){S.sessions.push({date:today(),min,type});save()}
function stats(){const days=[...new Set(S.sessions.map(s=>s.date))].sort(),set=new Set(days);let cur=0,d=new Date();if(!set.has(day(d)))d.setDate(d.getDate()-1);while(set.has(day(d))){cur++;d.setDate(d.getDate()-1)}let best=0,run=0,prev=null;days.forEach(x=>{run=prev&&(new Date(x)-new Date(prev))==864e5?run+1:1;best=Math.max(best,run);prev=x});
const mins=n=>{const c=day(Date.now()-n*864e5);return S.sessions.filter(s=>s.date>c).reduce((a,s)=>a+s.min,0)};return{n:S.sessions.length,min:S.sessions.reduce((a,s)=>a+s.min,0),cur,best,wk:mins(7),mo:mins(30),set}}
const lessonsDone=()=>Object.values(S.lessons).filter(Boolean).length;
const card=r=>{const f=S.fav.includes(r.u+r.t);return`<div class="card"><span class="m">${r.c} · ${r.k=="v"?"Video":r.k=="a"?"Audio":"Reading"}${r.du?" · "+r.du:""} · ${r.l}</span><h3>${esc(r.t)}</h3><p>${esc(r.d||"")}</p><p class="m">By ${esc(r.by)}${r.org?" · "+esc(r.org):""}<br>Source: ${esc(r.src)} · License: ${esc(r.lic)}</p><div class="row"><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer"><button class="p">${r.k=="r"?"Read Online":r.k=="a"?"Listen":"Watch"}</button></a><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer"><button>Original Source</button></a><button aria-label="Favorite" onclick="fav(this.dataset.k)" data-k="${esc(r.u+r.t)}">${f?"❤️":"🤍"}</button></div></div>`};
const list=kinds=>{const all=[...RES,...S.mine].filter(r=>kinds.includes(r.k)&&(r.t+r.d+r.c+r.by).toLowerCase().includes(q.toLowerCase()));return`<input placeholder="Search / filter by title or category" value="${esc(q)}" oninput="q=this.value;view();const i=$('input');i.focus();i.setSelectionRange(q.length,q.length)">`+(all.length?all.map(card).join(""):'<p class="m">No matching resources.</p>')+`<p class="m">Resources open on their original sites. Please respect each license (most listed here are non-commercial, no-derivatives).</p>`};
function fav(k){S.fav=S.fav.includes(k)?S.fav.filter(x=>x!=k):[...S.fav,k];save();view()}
function addR(){const g=id=>$(id).value.trim();if(!g("#ru")||!g("#rt")||!g("#rl")){alert("Title, URL and license are required.");return}if(!/^https?:\/\//.test(g("#ru"))){alert("URL must start with http(s)://");return}S.mine.push({k:$("#rk").value,c:"My resources",t:g("#rt"),d:"",by:g("#rb")||"Unknown",l:"-",src:g("#rs")||"User added",lic:g("#rl"),u:g("#ru")});save();view()}
function view(){const a=$("#app");$("#nav").innerHTML=["home","learn","meditate","videos","library","journal","progress","research","faq","about"].map(k=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${t(k)}</button>`).join("");
document.documentElement.lang=L;
const V={home:()=>`<div class="hero"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="var(--ac2)"/><circle cx="50" cy="38" r="9" fill="var(--ac)"/><path d="M28 72c0-14 10-22 22-22s22 8 22 22z" fill="var(--ac)"/><path d="M10 80q20-10 40 0t40 0" stroke="var(--ac)" fill="none" stroke-width="2"/></svg><h1>🧘 VIPASSANA MEDITATION</h1><p><b>${t("sub")}</b></p><p>${t("intro")}</p><div class="row" style="justify-content:center"><button class="p" onclick="go('meditate')">${t("sm")}</button><button onclick="go('learn')">${t("sl")}</button></div></div>
<div class="card"><h3>${t("today")}</h3><p><b>Breath Awareness</b> · 10 min</p><p>Sit comfortably and observe your natural breathing. Do not force or change the breath. Whenever attention wanders, gently return to awareness of breathing.</p><p class="m">What did I observe during today's practice?</p>${S.sessions.some(s=>s.date==today()&&s.type=="Daily")?"✅":`<button class="p" onclick="log(10,'Daily');view()">${t("done")}</button>`}</div>
<p class="m">This application is intended for educational and general wellness purposes. Meditation is not a substitute for professional medical or mental-health care. If you experience significant psychological or physical difficulties, seek appropriate professional support.</p>`,
learn:()=>`<h2>${t("learn")}</h2><div class="card"><div class="bar"><i style="width:${lessonsDone()/MODS.length*100}%"></i></div><p class="m">${lessonsDone()}/${MODS.length}</p></div>`+MODS.map((m,i)=>{const open=i==0||S.lessons[i-1],ti=L=="ne"?m[1]:L=="hi"?m[2]:m[0];return`<div class="card ${open?"":"lock"}"><h3>${open?"📖":"🔒"} ${i+1}. ${ti}</h3>${open?`<ul>${m[3].map(x=>`<li>${x}</li>`).join("")}</ul><button onclick="S.lessons[${i}]=!S.lessons[${i}];save();view()">${S.lessons[i]?"✅ Completed":"Mark complete"}</button>`:"<p class='m'>Complete the previous module to unlock.</p>"}</div>`}).join(""),
meditate:()=>{const m=Math.floor(tm.left/60),s=tm.left%60,pc=100-tm.left/tm.dur*100;return`<h2>${t("meditate")}</h2><div class="card"><div class="time" id="tt">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div><div class="bar"><i id="tb" style="width:${pc}%"></i></div><div class="row" style="justify-content:center;margin-top:12px"><button class="p" onclick="tgl()">${tm.run?t("pause"):t("start")}</button><button onclick="rst()">${t("reset")}</button></div></div>
<div class="card"><div class="row">${[5,10,15,20,30,45,60].map(x=>`<button onclick="setd(${x})">${x} min</button>`).join("")}</div><label>Custom (minutes)<input type="number" min="1" max="180" id="cu" onchange="setd(+this.value)"></label><label>Interval bell<select onchange="tm.int=+this.value"><option value="0">Off</option><option value="5" ${tm.int==5?"selected":""}>Every 5 min</option><option value="10" ${tm.int==10?"selected":""}>Every 10 min</option></select></label><p class="m">Bells at start and end. Sessions over 1 minute are saved to your progress.</p></div>`},
videos:()=>`<h2>${t("videos")}</h2>`+list(["v","a"]),
library:()=>`<h2>${t("library")}</h2>`+list(["r"])+`<div class="card"><h3>Add a resource</h3><p class="m">Only add items you have the right to link to. Stored on this device only.</p><label>Type<select id="rk"><option value="v">Video</option><option value="a">Audio</option><option value="r">Reading</option></select></label><label>Title<input id="rt"></label><label>Author<input id="rb"></label><label>Source<input id="rs"></label><label>License<input id="rl"></label><label>URL<input id="ru" type="url"></label><p><button class="p" onclick="addR()">Add</button></p></div>`,
journal:()=>`<h2>${t("journal")}</h2><div class="card"><input type="hidden" id="jid" value=""><label>Date<input type="date" id="jd" value="${today()}"></label><label>Duration (min)<input type="number" id="jm" value="10"></label><label>Type<select id="jt">${TYPES.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Mood before<select id="jb">${MOODS.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Mood after<select id="ja">${MOODS.map(x=>`<option>${x}</option>`).join("")}</select></label><label>What did I observe?<textarea id="jo" rows="3"></textarea></label><label>Reflection<textarea id="jr" rows="3"></textarea></label><p><button class="p" onclick="saveJ()">${t("save")}</button></p></div>`+(S.journal.length?[...S.journal].reverse().map(e=>`<div class="card"><b>${e.date}</b> · ${e.min} min · ${e.type}<br><span class="m">${e.b} → ${e.a}</span><p>${esc(e.o)}</p><p>${esc(e.r)}</p><button onclick="editJ(${e.id})">Edit</button> <button onclick="delJ(${e.id})">Delete</button></div>`).join(""):`<p class="m">No entries yet. Your journal stays private on this device.</p>`),
progress:()=>{const x=stats(),days=[...Array(7)].map((_,i)=>{const d=day(Date.now()-(6-i)*864e5);return S.sessions.filter(s=>s.date==d).reduce((a,s)=>a+s.min,0)}),mx=Math.max(...days,1),pct=Math.min(100,Math.round(x.wk/S.goal*100)),cal=[...Array(30)].map((_,i)=>day(Date.now()-(29-i)*864e5));

<div class="card"><h3>Weekly goal: ${S.goal} min</h3><div class="bar"><i style="width:${pct}%"></i></div><p class="m">${pct}%</p><label>Goal (minutes/week)<input type="number" value="${S.goal}" onchange="S.goal=Math.max(1,+this.value||70);save();view()"></label></div>
<div class="card"><h3>Last 7 days</h3><div class="chart">${days.map(v=>`<div title="${v} min" style="height:${v/mx*100}%"></div>`).join("")}</div></div><div class="card"><h3>Last 30 days</h3><div class="cal">${cal.map(d=>`<i class="${x.set.has(d)?"d":""}" title="${d}"></i>`).join("")}</div></div>

function go(k){tab=k;view();scrollTo(0,0)}
function setd(m){if(!m||m<1)return;tm.run=false;clearInterval(tm.id);tm.dur=tm.left=m*60;view()}
function rst(){tm.run=false;clearInterval(tm.id);tm.left=tm.dur;view()}
function tgl(){if(tm.run){tm.run=false;clearInterval(tm.id);view();return}tm.run=true;if(tm.left==tm.dur){bell()}tm.end=Date.now()+tm.left*1000;tm.last=tm.dur-tm.left;tm.id=setInterval(tick,500);view()}
function tick(){tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));const el=tm.dur-tm.left;if(tm.int&&el>0&&el%(tm.int*60)==0&&el!=tm.last&&tm.left>0){tm.last=el;bell()}
if(tm.left==0){clearInterval(tm.id);tm.run=false;bell();const m=Math.round(tm.dur/60);if(m>=1)log(m,"Timer");tm.left=tm.dur}
if(tab=="meditate"){const x=$("#tt");if(x){x.textContent=String(Math.floor(tm.left/60)).padStart(2,"0")+":"+String(tm.left%60).padStart(2,"0");$("#tb").style.width=(100-tm.left/tm.dur*100)+"%"}if(!tm.run)view()}}
function saveJ(){const e={id:+$("#jid").value||Date.now(),date:$("#jd").value,min:+$("#jm").value||0,type:$("#jt").value,b:$("#jb").value,a:$("#ja").value,o:$("#jo").value,r:$("#jr").value},i=S.journal.findIndex(x=>x.id==e.id);i>=0?S.journal[i]=e:S.journal.push(e);save();view()}

function delJ(id){if(confirm("Delete this entry?")){S.journal=S.journal.filter(x=>x.id!=id);save();view()}}
